apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: cicd
---
# Permissions in coinops-data namespace (postgres, redis, rabbitmq)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coinops-deployer
  namespace: coinops-data
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-data
  namespace: coinops-data
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: cicd
roleRef:
  kind: Role
  name: coinops-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Permissions in coinops-app namespace (proxy, history, ui)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coinops-deployer
  namespace: coinops-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-app
  namespace: coinops-app
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: cicd
roleRef:
  kind: Role
  name: coinops-deployer
  apiGroup: rbac.authorization.k8s.io