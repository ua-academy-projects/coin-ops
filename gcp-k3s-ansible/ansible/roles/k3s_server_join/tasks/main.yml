---
- name: Install joining K3s control-plane node
  shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_CHANNEL="{{ k3s_channel }}" \
      K3S_URL="{{ k3s_server_url }}" \
      K3S_TOKEN="{{ k3s_cluster_token }}" \
      sh -s - server \
      --write-kubeconfig-mode {{ k3s_config_mode }} \
      {% for item in k3s_disable_components %} --disable {{ item }}{% endfor %} \
      {% for item in k3s_node_extra_args %} {{ item }}{% endfor %}
  args:
    creates: /etc/systemd/system/k3s.service
    executable: /bin/bash

- name: Wait for K3s service on joining server
  systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for local K3s API socket
  wait_for:
    host: 127.0.0.1
    port: "{{ k3s_api_port }}"
    timeout: 180
