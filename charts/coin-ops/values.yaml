#NOTE: MAYBE ITS BETTER TO MAKE FILE FLATTEN

namespaces:
  create: false # bc ansible creates ns before helm runc
  app: coin-ops-app
  workers: coin-ops-workers
  data: coin-ops-data

app:
  name: coin-ops

imagePullSecrets:
  - name: ghcr-pull-secret

config:
  name: coin-ops-config
  data:
    RUNTIME_BACKEND: external
    HISTORY_API_PORT: "8000"
    PROXY_PORT: "8080"
    PROXY_URL: /api
    HISTORY_URL: /history-api

secret:
  create: false
  name: coin-ops-secret

ingress:
  enabled: true
  name: coin-ops
  host: coinops
  className: ""
  annotations: {}
  middlewares:
    enabled: true
    api:
      name: strip-api-prefix
      prefixes:
        - /api
    history:
      name: strip-history-prefix
      prefixes:
        - /history-api
  tls: []

redis:
  enabled: true
  name: redis
  image:
    repository: redis
    tag: 7.4.9-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 6379
    headless: true
  persistence:
    enabled: true
    existingClaim: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  config: |
    appendonly yes
    maxmemory 192mb
    maxmemory-policy allkeys-lru
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

rabbitmq:
  enabled: true
  name: rabbitmq
  image:
    repository: rabbitmq
    tag: 3.13.7-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 5672
    headless: true
  persistence:
    enabled: true
    existingClaim: ""
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 60
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

proxy:
  enabled: true
  name: proxy
  replicas: 1
  image:
    repository: ghcr.io/ua-academy-projects/coin-ops-proxy
    tag: shabat-latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  containerPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

historyApi:
  enabled: true
  name: history-api
  replicas: 1
  image:
    repository: ghcr.io/ua-academy-projects/coin-ops-history-api
    tag: shabat-latest
    pullPolicy: IfNotPresent
  service:
    port: 8000
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

historyConsumer:
  enabled: true
  name: history-consumer
  replicas: 1
  image:
    repository: ghcr.io/ua-academy-projects/coin-ops-history-consumer
    tag: shabat-latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 30

ui:
  enabled: true
  name: ui
  replicas: 1
  image:
    repository: ghcr.io/ua-academy-projects/coin-ops-ui
    tag: shabat-latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  containerPort: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
