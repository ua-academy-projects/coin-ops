{{- if and .Values.ui.enabled .Values.ui.proxyConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.ui.proxyConfig.configMapName }}
  namespace: {{ include "coin-ops.appNamespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.ui.name) | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ .Values.proxy.name }}:{{ .Values.proxy.service.port }}/;
        }

        location /history-api/ {
            proxy_pass http://{{ .Values.historyApi.name }}:{{ .Values.historyApi.service.port }}/;
        }

        location / {
            try_files $uri /index.html;
        }

        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        gzip on;
        gzip_types text/html text/css application/javascript;
    }
{{- end }}
