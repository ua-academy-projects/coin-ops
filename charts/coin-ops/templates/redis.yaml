{{- if .Values.redis.enabled }}
{{- if ne (int .Values.redis.replicas) 1 }}
{{- fail "redis.replicas must be 1 because this chart uses one Redis data volume, not per-replica volumeClaimTemplates" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.redis.name }}-config
  namespace: {{ include "coin-ops.namespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.redis.name) | nindent 4 }}
data:
  redis.conf: |
{{ .Values.redis.config | indent 4 }}
---
{{- if and .Values.redis.persistence.enabled (not .Values.redis.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.redis.name }}-data
  namespace: {{ include "coin-ops.namespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.redis.name) | nindent 4 }}
spec:
  accessModes:
{{- range .Values.redis.persistence.accessModes }}
    - {{ . }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ include "coin-ops.namespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.redis.name) | nindent 4 }}
spec:
  serviceName: {{ .Values.redis.name }}
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.redis.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.redis.name }}
        app.kubernetes.io/part-of: {{ include "coin-ops.partOf" . }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.redis.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.redis.podSecurityContext | indent 8 }}
      containers:
        - name: {{ .Values.redis.name }}
          image: {{ include "coin-ops.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.redis.securityContext | indent 12 }}
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: {{ .Values.redis.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.readinessProbe.periodSeconds }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: {{ .Values.redis.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.redis.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.redis.livenessProbe.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command:
                  - redis-cli
                  - shutdown
                  - save
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: {{ .Values.redis.name }}-config
        - name: redis-data
{{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Values.redis.name) .Values.redis.persistence.existingClaim }}
{{- else }}
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ include "coin-ops.namespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.redis.name) | nindent 4 }}
spec:
{{- if .Values.redis.service.headless }}
  clusterIP: None
{{- end }}
  selector:
    app.kubernetes.io/name: {{ .Values.redis.name }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
{{- end }}
