{{- if .Values.ui.enabled }}
{{- if .Values.ui.proxyConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.ui.proxyConfig.configMapName }}
  namespace: {{ include "coin-ops.appNamespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.ui.name) | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ .Values.proxy.name }}:{{ .Values.proxy.service.port }}/;
        }

        location /history-api/ {
            proxy_pass http://{{ .Values.historyApi.name }}:{{ .Values.historyApi.service.port }}/;
        }

        location / {
            try_files $uri /index.html;
        }

        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        gzip on;
        gzip_types text/html text/css application/javascript;
    }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  namespace: {{ include "coin-ops.appNamespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.ui.name) | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ui.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.ui.name }}
        app.kubernetes.io/part-of: {{ include "coin-ops.partOf" . }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds }}
      {{- include "coin-ops.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Values.ui.name }}
          image: {{ include "coin-ops.image" .Values.ui.image }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.ui.securityContext | indent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
{{- if .Values.ui.proxyConfig.enabled }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
{{- end }}
          env:
            - name: PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: PROXY_URL
            - name: HISTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: HISTORY_URL
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.livenessProbe.failureThreshold }}
{{- if .Values.ui.proxyConfig.enabled }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.ui.proxyConfig.configMapName }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ui.name }}
  namespace: {{ include "coin-ops.appNamespace" . }}
  labels:
    {{- include "coin-ops.nameLabels" (dict "root" . "name" .Values.ui.name) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.ui.name }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
