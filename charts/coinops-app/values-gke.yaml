# values-gke.yaml — overrides for deploying coinops-app to GKE (managed control plane).
# Apply (Jenkins does this):
#   helm upgrade --install coinops-app charts/coinops-app \
#     -f charts/coinops-app/values.yaml -f charts/coinops-app/values-gke.yaml \
#     --set image.registry=<AR> --set image.tag=<SHORT_SHA>
image:
  registry: europe-central2-docker.pkg.dev/coinops-student-leev1tan-001/coinops
  # tag is set by the Jenkins deploy job: --set image.tag=<SHORT_SHA>

# No k8s Ingress on GKE — cloudflared (Cloudflare Zero Trust) exposes the gateway
# (app public + Jenkins UI behind Access). The gateway Service stays ClusterIP;
# cloudflared reaches it in-cluster.
ingress:
  enabled: false

# GKE's default datapath doesn't enforce NetworkPolicy, and the chart's policies
# hard-code k3s CIDRs — off here. (NetworkPolicy is showcased on the k3s chapter.)
networkPolicy:
  enabled: false
