---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coinops-history-api
  namespace: {{ .Values.historyApi.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-api
  namespace: {{ .Values.historyApi.namespace }}
  labels:
    app: history-api
    {{- include "coinops-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.historyApi.replicas }}
  selector:
    matchLabels:
      app: history-api
  template:
    metadata:
      labels:
        app: history-api
    spec:
      serviceAccountName: coinops-history-api
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: history-api
          image: "{{ .Values.image.registry }}/{{ .Values.historyApi.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: coinops-app-config
            - secretRef:
                name: coinops-app-secrets
          env:
            - name: PORT
              value: "{{ .Values.historyApi.port }}"
          ports:
            - containerPort: {{ .Values.historyApi.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: history-api
  namespace: {{ .Values.historyApi.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: history-api
  ports:
    - port: {{ .Values.historyApi.port }}
      targetPort: {{ .Values.historyApi.port }}
