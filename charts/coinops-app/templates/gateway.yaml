---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coinops-gateway
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coinops-gateway-conf
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
      }

      location /api/ {
        proxy_pass http://proxy.{{ .Values.proxy.namespace }}.svc.cluster.local:{{ .Values.proxy.port }}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /history-api/ {
        proxy_pass http://history-api.{{ .Values.historyApi.namespace }}.svc.cluster.local:{{ .Values.historyApi.port }}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://ui.{{ .Values.ui.namespace }}.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app: gateway
    {{- include "coinops-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: coinops-gateway
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: coinops-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coinops
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "coinops-app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
