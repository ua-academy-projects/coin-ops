{{- $appNs := list .Values.proxy.namespace .Values.historyApi.namespace .Values.historyConsumer.namespace }}
{{- range $ns := $appNs }}
---
apiVersion: v1
kind: Secret
metadata:
  name: coinops-app-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "coinops-app.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "app.databaseUrl must be set (pass via --set or values.yaml)" $.Values.app.databaseUrl | quote }}
  RABBITMQ_URL: {{ required "app.rabbitmqUrl must be set (pass via --set or values.yaml)" $.Values.app.rabbitmqUrl | quote }}
  REDIS_URL:    {{ required "app.redisUrl must be set (pass via --set or values.yaml)"    $.Values.app.redisUrl    | quote }}
{{- end }}
