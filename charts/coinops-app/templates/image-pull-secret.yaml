{{- /*
gateway.namespace is intentionally excluded: the gateway uses the public nginx
image (Values.gateway.image, no registry prefix) so no GHCR pull secret is
needed there. If gateway is ever switched to a private image, add its namespace
to $pullNs and add imagePullSecrets to gateway.yaml.
*/ -}}
{{- if .Values.image.pullSecretDockerconfigjson }}
{{- $pullNs := list .Values.proxy.namespace .Values.historyApi.namespace .Values.historyConsumer.namespace .Values.ui.namespace }}
{{- range $ns := $pullNs }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: {{ $ns }}
  labels:
    {{- include "coinops-app.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.image.pullSecretDockerconfigjson }}
{{- end }}
{{- end }}
