# Image source. The full image name for a workload is registry/<image>:tag.
image:
  registry: ghcr.io/ua-academy-projects
  tag: dev-latest
  pullPolicy: IfNotPresent

# Hostnames + TLS.
ingress:
  className: traefik
  host: app.coinops.pp.ua
  tlsSecretName: coinops-app-tls
  certManagerClusterIssuer: letsencrypt-cloudflare

# Per-workload settings.
proxy:
  namespace: coinops-proxy
  image: coin-ops-proxy
  port: 8080
  replicas: 1
historyApi:
  namespace: coinops-history-api
  image: coin-ops-history-api
  port: 8000
  replicas: 1
historyConsumer:
  namespace: coinops-history-consumer
  image: coin-ops-history-consumer
  replicas: 1
ui:
  namespace: coinops-ui
  image: coin-ops-ui
  replicas: 1
gateway:
  namespace: coinops-gateway
  image: nginx:alpine
  replicas: 1

# Backing-tier namespaces (used only to author NetworkPolicy egress/ingress allows).
backingNamespaces:
  postgres: coinops-postgres
  rabbitmq: coinops-rabbitmq
  redis: coinops-redis

# NetworkPolicy knobs.
networkPolicy:
  enabled: true
  # k3s defaults — used in the proxy's internet egress ipBlock except list.
  podCidr: 10.42.0.0/16
  serviceCidr: 10.43.0.0/16
