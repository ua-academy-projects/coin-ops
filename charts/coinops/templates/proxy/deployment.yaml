{{- if .Values.proxy.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.proxy.name }}
  namespace: {{ .Values.global.backendNamespace }}
  labels:
    {{- include "coinops.labels" (dict "ctx" . "component" .Values.proxy.name) | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "coinops.selectorLabels" (dict "ctx" . "component" .Values.proxy.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coinops.selectorLabels" (dict "ctx" . "component" .Values.proxy.name) | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: proxy
          image: {{ include "coinops.image" (dict "ctx" . "image" .Values.proxy.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.proxy.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.proxy.containerPort | quote }}
            - name: RUNTIME_BACKEND
              value: {{ .Values.global.runtimeBackend | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.backendEnvSecret }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
{{- end }}
