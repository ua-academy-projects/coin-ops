{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  namespace: {{ .Values.global.frontendNamespace }}
  labels:
    {{- include "coinops.labels" (dict "ctx" . "component" .Values.ui.name) | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "coinops.selectorLabels" (dict "ctx" . "component" .Values.ui.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coinops.selectorLabels" (dict "ctx" . "component" .Values.ui.name) | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: ui
          image: {{ include "coinops.image" (dict "ctx" . "image" .Values.ui.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
          env:
            - name: PROXY_URL
              value: {{ .Values.ui.proxyUrl | quote }}
            - name: HISTORY_URL
              value: {{ .Values.ui.historyUrl | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
{{- end }}
