general:
  cloud: "hybrid"
  project_id: "devops-intern-penina"
  location: "europe"
  disk_size: 30
  ssh_port: "9922"
  ops_user: "marta_ops"
  database: "aws"


locations:
  europe:
    gcp:
      region: "europe-central2"
      zones:
        primary: "europe-central2-a"
        secondary: "europe-central2-b"
    aws:
      region: "eu-central-1"
      zones:
        primary: "eu-central-1a"
        secondary: "eu-central-1b"
    azure:
      region: "swedencentral"
      zones:
        primary: "1"
        secondary: "2"
  us:
    gcp:
      region: "us-central1"
      zones:
        primary: "us-central1-a"
        secondary: "us-central1-b"
    aws:
      region: "us-east-1"
      zones:
        primary: "us-east-1a"
        secondary: "us-east-1b"
    azure:
      region: "eastus"
      zones:
        primary: "1"
        secondary: "2"

images:
  ubuntu_2404:
    gcp: "ubuntu-os-cloud/ubuntu-2404-lts-amd64"
    aws: "ami-0084a47cc718c111a"
    azure: "Canonical:ubuntu-24_04-lts:server:latest"

sizes:
  small:
    gcp: "e2-micro"
    aws: "t3.micro"
    azure: "Standard_B2s_v2"
  medium:
    gcp: "e2-small"
    aws: "t3.small"
    azure: "Standard_B2s_v2"

# gateway is a separate VM
vms:
  jump-host:
    cloud: "azure"
    size: small
    zone: primary
    tags: ["jump-host"]
    public_ip: true

  gateway-azure:
    cloud: "azure"
    size: small
    zone: primary
    tags: ["gateway"]
    public_ip: true

  gateway-aws:
    cloud: "aws"
    size: small
    zone: primary
    tags: ["gateway"]
    public_ip: true

  node-01:
    cloud: "aws"
    size: small
    zone: primary
    tags: ["internal", "history", "queue"]
    public_ip: false

  node-02:
    cloud: "aws"
    size: small
    zone: primary
    tags: ["internal", "proxy"]
    public_ip: false

  node-03:
    cloud: "azure"
    size: small
    zone: secondary
    tags: ["ui", "web"]
    public_ip: true