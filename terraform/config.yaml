# Purpose: Terraform infrastructure config.
# Currently set to GCP-only mode for Task 4 (k3s + CloudSQL).
# To restore hybrid deployment: change cloud back to "hybrid" and
# uncomment AWS/Azure VMs below.

general:
  cloud: "gcp"           # changed from "hybrid" — GCP only for Task 4
  project_id: "devops-intern-penina"
  location: "europe"
  disk_size: 30
  ssh_port: "9922"
  ops_user: "marta_ops"
  database: "cnpg"        # cnpg = PostgreSQL runs inside k3s cluster via CNPG operator

locations:
  europe:
    gcp:
      region: "europe-central2"
      zones:
        primary: "europe-central2-a"
        secondary: "europe-central2-b"
    aws:
      region: "eu-central-1"
      zones:
        primary: "eu-central-1a"
        secondary: "eu-central-1b"
    azure:
      region: "swedencentral"
      zones:
        primary: "1"
        secondary: "2"
  us:
    gcp:
      region: "us-central1"
      zones:
        primary: "us-central1-a"
        secondary: "us-central1-b"
    aws:
      region: "us-east-1"
      zones:
        primary: "us-east-1a"
        secondary: "us-east-1b"
    azure:
      region: "eastus"
      zones:
        primary: "1"
        secondary: "2"

images:
  ubuntu_2404:
    gcp: "ubuntu-os-cloud/ubuntu-2404-lts-amd64"
    aws: "ami-0084a47cc718c111a"
    azure: "Canonical:ubuntu-24_04-lts:server:latest"

sizes:
  small:
    gcp: "e2-micro"
    aws: "t3.micro"
    azure: "Standard_B2s_v2"
  medium:
    gcp: "e2-medium"
    aws: "t3.small"
    azure: "Standard_B2s_v2"

vms:
  # ── AWS/Azure VMs commented out — not needed for Task 4 (k3s on GCP) ──
  # Uncomment to restore hybrid deployment for Tasks 1-2.
  #
  # jump-host:
  #   cloud: "aws"
  #   size: small
  #   zone: primary
  #   tags: ["jump-host"]
  #   public_ip: true
  #
  # gateway-azure:
  #   cloud: "azure"
  #   size: small
  #   zone: primary
  #   tags: ["gateway"]
  #   public_ip: true
  #
  # gateway-aws:
  #   cloud: "aws"
  #   size: small
  #   zone: primary
  #   tags: ["gateway"]
  #   public_ip: true
  #
  # node-01:
  #   cloud: "aws"
  #   size: small
  #   zone: primary
  #   tags: ["internal", "history", "queue"]
  #   public_ip: false
  #
  # node-02:
  #   cloud: "aws"
  #   size: small
  #   zone: primary
  #   tags: ["internal", "proxy"]
  #   public_ip: false
  #
  # node-03:
  #   cloud: "azure"
  #   size: small
  #   zone: secondary
  #   tags: ["ui", "web"]
  #   public_ip: false

  # ── GCP k3s cluster — active for Task 4 ──────────────────────────────
  k3s-server-1:
    cloud: "gcp"
    size: medium
    zone: primary
    tags: ["k3s-server"]
    public_ip: true

  k3s-server-2:
    cloud: "gcp"
    size: medium
    zone: primary
    tags: ["k3s-server"]
    public_ip: false

  k3s-server-3:
    cloud: "gcp"
    size: medium
    zone: secondary
    tags: ["k3s-server"]
    public_ip: false