apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name | quote }}
spec:
  acme:
    server: {{ .Values.acmeServer | quote }}
    email: {{ .Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" .Values.name | quote }}
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingressClass | quote }}
