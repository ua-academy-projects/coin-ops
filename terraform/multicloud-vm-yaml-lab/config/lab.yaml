# yaml-language-server: $schema=./lab.schema.json
cloud: azure
location: eu_central

name_prefix: coinops-lab

ssh:
  user: vova
  public_key_path: ~/.ssh/coinops_gcp_jump.pub
  private_key_path: ~/.ssh/coinops_gcp_jump

clouds:
  gcp:
    project_id: coinops-student-leev1tan-001
    # k3s_only: build ONLY network + bastion + k3s nodes on GCP — skip the
    # managed app stack (Cloud SQL / Pub-Sub / Memorystore / app VMs / LB).
    # The coin-ops app lives on AWS; GCP is just the k3s learning sandbox.
    k3s_only: true
    # Managed Kubernetes chapter. Set enabled:true (and `cloud: gcp` at top) to
    # provision GKE in the lab VPC. Uses a separate terraform workspace/state.
    gke:
      enabled: false
      node_machine_type: e2-medium
      min_nodes: 1
      max_nodes: 3
      release_channel: REGULAR
      subnet_cidr: 10.10.30.0/24
      pods_cidr: 10.20.0.0/16
      services_cidr: 10.30.0.0/20
  aws:
    profile: coinops-admin
    terraform_iam_user: terraform-coinops-lab
    app_instance_profile_name: coinops-lab-app-runtime-profile
  azure:
    subscription_id: "d3b3e628-b7a2-40cc-aa61-748e5eada88b"
    tenant_id: "266e1f49-9265-4b5d-918f-bd82b627d456"
    location: eastus2
    resource_group_name: coinops-lab-rg
    key_vault_name: coinopslabkv
    state_location: eastus2
    state_resource_group_name: coinops-tfstate-rg
    state_storage_account_name: coinopslabtfstate
    state_container_name: tfstate
    state_key: multicloud-vm-yaml-lab/terraform.tfstate
    # Human operator(s) who run `lab.sh secrets push` and whose `az` identity the
    # ansible cloud_secrets role uses to read the vault. Granted Key Vault data-plane
    # access in Terraform so it survives re-applies (object id from `az ad signed-in-user show`).
    operator_object_ids:
      - "5026b5bc-4652-409d-afd9-f8e1072e1146"
    # k3s_only: build ONLY network + bastion + k3s nodes on Azure — skip the
    # managed app stack (Azure Database / Service Bus / Cache / app VMs / LB).
    # Mirrors the GCP k3s sandbox; the cluster fits the subscription's 4-vCPU cap.
    k3s_only: true


secrets:
  prefix: coinops-lab
  items:
    db_password: db-password
    rabbitmq_password: rabbitmq-password
    ghcr_token: ghcr-token
    cloudflare_token: cloudflare-token
    tailscale_auth_key: tailscale-auth-key
# Replace these before the HTTPS/DNS apply.
domain:
  enabled: true
  name: coinops.pp.ua
  root: coinops.pp.ua
  ui:
    name: coinops.pp.ua
    # cloud override cleared: falls back to the top-level `cloud:` so the
    # whole stack lands on one cloud. Set to a cloud name only to split
    # the UI onto a different cloud than the backend.
    cloud: ""
  api:
    name: api.coinops.pp.ua
    # cloud override cleared: backend follows the top-level `cloud:`.
    cloud: ""
  cloudflare_zone_id: 48a16dd57c128fb6b341e10dfe8eef6b
  create_records: true
  cloudflare_proxy: true
  # Base domain for the GCP k3s ingress hosts (<app>.<this>). Single source of
  # truth: drives both the Cloudflare wildcard A record (terraform) and the
  # ansible ingress hostnames (via coinops_k3s_ingress_domain).
  k3s_ingress: coinops.pp.ua
  # Cloudflare Zero Trust (GCP k3s edge). Terraform creates two cloudflared
  # tunnels (apps in-cluster, admin on the bastion), their routing, proxied
  # DNS, Access policies, and writes the tunnel tokens into Secret Manager.
  # Flip enabled:true ONLY AFTER the one-time setup:
  #   1) Create a Cloudflare API token (Account>Cloudflare Tunnel:Edit,
  #      Account>Access: Apps and Policies:Edit, Zone>DNS:Edit, Zone>Zone:Read)
  #      and `export CLOUDFLARE_API_TOKEN=...`.
  #   2) Turn on Zero Trust in the dashboard (pick a team name).
  # account_id + access_emails below are consumed by terraform.
  cloudflare_account_id: 5f9c49428f4150cf25eefe619dad508c
  zero_trust:
    enabled: true
    access_emails:
      - vshabat64@gmail.com

networks:
  lab:
    name: coinops-lab-vpc
    subnet_name: coinops-lab-subnet
    cidr: 10.10.0.0/16
    gcp_subnet_cidr: 10.10.0.0/24
    public_subnet_cidrs:
      - 10.10.0.0/24
      - 10.10.1.0/24
    private_subnet_cidrs:
      - 10.10.10.0/24
      - 10.10.11.0/24
    # GCP uses distinct private subnets so the two bastions advertise
    # non-overlapping routes into the tailnet (the VPCs never peer, only
    # the advertised routes must not collide). AWS keeps .10/.11, GCP
    # gets .20/.21.
    gcp_private_subnet_cidrs:
      - 10.10.20.0/24
      - 10.10.21.0/24

firewall:
  ssh_source_ranges:
    - 193.242.163.206/32
  web_source_ranges:
    - 0.0.0.0/0
  allow_icmp_from_bastion: true

defaults:
  size: micro
  image: ubuntu_2204
  disk_size_gb: 10
  network: lab

# Azure Monitor observability backend (observability.tf). Flip enabled:true ONLY
# AFTER the k3s cluster is up and Arc-connected — it provisions Log Analytics,
# managed Prometheus, Application Insights, Managed Grafana and the alert action
# group. Left off so it never affects the initial provisioning apply.
observability:
  enabled: true
  alert_email: vshabat64@gmail.com
  azure_native:
    enabled: true
    export_platform_metrics: true
    alerts_enabled: true
    workbook_enabled: true
    cpu_threshold_percent: 85
    nat_packet_drop_threshold: 0

runtime:
  mode: cloud-native
  database:
    mode: managed_postgres
    engine: postgres
    version: "16"
    name: cognitor
    user: cognitor
    size: small
    storage_gb: 20
    publicly_accessible: false
  queue:
    mode: managed
    name: market-events
    dead_letter: true
    visibility_timeout_seconds: 30
    max_receive_count: 3
  sessions:
    backend: managed_valkey
    ttl_hours: 24
  cache:
    mode: managed_valkey
    engine: valkey
    size: micro
    port: 6379
    auth: false
    transit_encryption: false

roles:
  bastion:
    public_ip: true
    tags: [bastion]
  app:
    public_ip: false
    tags: [app]
  db:
    public_ip: false
    tags: [db]
  k3s:
    public_ip: false
    tags: [k3s]

app:
  port: 80
  health_path: /health
  nodes:
    bastion: bastion
    app:
      - app-2
    db: db
    # k3s learning cluster. Azure observability lab = a SINGLE 2-vCPU node
    # (size: medium). Single-node k3s (single-member embedded etcd, no HA-join)
    # so the control plane can't lose quorum, with 2 cores/8 GB of headroom for
    # the full Azure Monitor agent stack + Beyla + exporters. (3×1-vCPU starved
    # etcd once Beyla's eBPF ran on the control-plane nodes.)
    k3s:
      - k3s-1

catalog:
  locations:
    eu_central:
      gcp:
        region: europe-central2
        zone: europe-central2-a
        zones:
          - europe-central2-a
          - europe-central2-b
      aws:
        region: eu-central-1
        availability_zones:
          - eu-central-1a
          - eu-central-1b
      azure:
        location: eastus2
        zones:
          - "1"
          - "2"
          - "3"
  sizes:
    micro:
      gcp: e2-micro
      aws: t3.micro
      # Azure: classic B-series is NotAvailableForSubscription on this sub, and
      # the only x86 small SKUs in eastus2 are AMD F-series v7. micro = bastion.
      azure: Standard_F1als_v7   # 1 vCPU / 2 GB (AMD x86, eastus2)
    small:
      gcp: e2-small
      aws: t3.small
      azure: Standard_F1as_v7    # 1 vCPU / 4 GB (AMD x86, eastus2) — k3s nodes
    medium:
      # Single-node k3s observability lab: one 2-vCPU/8 GB node carries the k3s
      # control plane + the Azure Monitor agent stack (ama-logs/ama-metrics/Arc)
      # + Beyla + the backing-service exporters. 3×1-vCPU could not (eBPF on a
      # 1-core control-plane node starved etcd). Only the Azure k3s node uses it.
      gcp: e2-medium             # 2 vCPU / 4 GB — GKE node pool
      azure: Standard_F2as_v7    # 2 vCPU / 8 GB (AMD x86, eastus2)
  database_sizes:
    micro:
      gcp: db-f1-micro
      aws: db.t4g.micro
    small:
      gcp: db-g1-small
      aws: db.t4g.micro
      azure: B_Standard_B1ms
  cache_sizes:
    micro:
      aws:
        node_type: cache.t4g.micro
        engine_version: "7.2"
        replicas: 0
      gcp:
        node_type: SHARED_CORE_NANO
        engine_version: VALKEY_8_0
        shard_count: 1
        replica_count: 0
      azure:
        sku_name: Basic
        family: C
        capacity: 0
  images:
    ubuntu_2204:
      gcp: ubuntu-os-cloud/ubuntu-2204-lts
      aws:
        owners:
          - '099720109477'
        name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
      azure:
        publisher: Canonical
        offer: 0001-com-ubuntu-server-jammy
        # F-series v7 are Gen2-only VM SKUs, so the image must be the gen2 variant.
        sku: 22_04-lts-gen2
        version: latest

instances:
  bastion:
    role: bastion
    private_ip: 10.10.0.10
  app-1:
    role: app
    private_ip: 10.10.10.11
    subnet_key: "0"
  app-2:
    role: app
    private_ip: 10.10.11.11
    subnet_key: "1"
  db:
    role: db
    private_ip: 10.10.10.20
  # k3s learning cluster — three nodes, each a server+worker (HA k3s with
  # embedded etcd). Sized `small` to leave headroom for control-plane +
  # hello-world workloads.
  # IPs must match the compute module's round-robin subnet assignment
  # (instance index % number-of-private-subnets). On Azure the private subnets
  # are 10.10.10.0/24 (subnet-0) and 10.10.11.0/24 (subnet-1): even index →
  # subnet-0, odd index → subnet-1. (GCP used 10.10.20/21 via
  # gcp_private_subnet_cidrs; GCP is retired so these track Azure.)
  # Single-node Azure observability lab. k3s-2 / k3s-3 intentionally removed:
  # one 2-vCPU node (size: medium → Standard_F2as_v7) replaces the three
  # 1-vCPU nodes. To go back to a 3-node HA cluster, restore k3s-2/k3s-3 here
  # (size: small) and add them to app.nodes.k3s above.
  k3s-1:
    role: k3s
    size: medium
    private_ip: 10.10.10.40   # idx 0 → subnet-0 (10.10.10.0/24)
