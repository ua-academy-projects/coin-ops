---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coin-ops.fullname" . }}-history-api
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "coin-ops.name" . }}-history-api
