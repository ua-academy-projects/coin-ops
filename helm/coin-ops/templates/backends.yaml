apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coin-ops.fullname" . }}-backend-secret
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "coin-ops.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}"
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coin-ops.fullname" . }}-postgres-init
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
data:
  10-history-schema.sql: |
{{ .Files.Get "files/history-schema.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coin-ops.fullname" . }}-redis
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coin-ops.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "coin-ops.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coin-ops.fullname" . }}-redis
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "coin-ops.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coin-ops.fullname" . }}-rabbitmq
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coin-ops.name" . }}-rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "coin-ops.name" . }}-rabbitmq
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          ports:
            - name: amqp
              containerPort: {{ .Values.rabbitmq.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coin-ops.fullname" . }}-rabbitmq
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "coin-ops.name" . }}-rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.service.port }}
      targetPort: amqp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coin-ops.fullname" . }}-postgres
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coin-ops.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "coin-ops.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coin-ops.fullname" . }}-backend-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/10-history-schema.sql
              subPath: 10-history-schema.sql
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: postgres-init
          configMap:
            name: {{ include "coin-ops.fullname" . }}-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coin-ops.fullname" . }}-postgres
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "coin-ops.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coin-ops.fullname" . }}-proxy
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coin-ops.name" . }}-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "coin-ops.name" . }}-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.proxy.service.port | quote }}
            - name: RUNTIME_BACKEND
              value: "external"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@{{ include "coin-ops.fullname" . }}-rabbitmq:{{ .Values.rabbitmq.service.port }}/"
            - name: REDIS_URL
              value: "redis://{{ include "coin-ops.fullname" . }}-redis:{{ .Values.redis.service.port }}/0"
          ports:
            - name: http
              containerPort: {{ .Values.proxy.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coin-ops.fullname" . }}-proxy
  labels:
{{ include "coin-ops.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "coin-ops.name" . }}-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
---
apiVersion: apps/v1
