---
# RabbitMQ credentials — used by rabbitmq pod and proxy/history-consumer
apiVersion: v1
kind: Secret
metadata:
  name: coinops-rabbitmq-secret
  namespace: {{ .Values.namespaces.rabbitmq }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.user | b64enc }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitmqPassword | b64enc }}
---
# App secrets — database and rabbitmq URLs for proxy and history services
apiVersion: v1
kind: Secret
metadata:
  name: coinops-app-secret
  namespace: {{ .Values.namespaces.historyApi }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.database.user .Values.secrets.dbPassword .Values.database.host .Values.database.name | b64enc }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq.%s.svc.cluster.local:5672/" .Values.rabbitmq.user .Values.secrets.rabbitmqPassword .Values.namespaces.rabbitmq | b64enc }}
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | b64enc }}
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
---
# Same app secret for proxy namespace
apiVersion: v1
kind: Secret
metadata:
  name: coinops-app-secret
  namespace: {{ .Values.namespaces.proxy }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.database.user .Values.secrets.dbPassword .Values.database.host .Values.database.name | b64enc }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq.%s.svc.cluster.local:5672/" .Values.rabbitmq.user .Values.secrets.rabbitmqPassword .Values.namespaces.rabbitmq | b64enc }}
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | b64enc }}
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
---
# CNPG database credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-db-secret
  namespace: {{ .Values.namespaces.db }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.database.user | b64enc }}
  password: {{ .Values.secrets.dbPassword | b64enc }}
---
# App secret for history-consumer namespace
apiVersion: v1
kind: Secret
metadata:
  name: coinops-app-secret
  namespace: {{ .Values.namespaces.historyConsumer }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.database.user .Values.secrets.dbPassword .Values.database.host .Values.database.name | b64enc }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq.%s.svc.cluster.local:5672/" .Values.rabbitmq.user .Values.secrets.rabbitmqPassword .Values.namespaces.rabbitmq | b64enc }}
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | b64enc }}
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
---
# GHCR pull secret for proxy namespace
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespaces.proxy }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken (printf "%s:%s" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken | b64enc) | b64enc }}
---
# GHCR pull secret for history-api namespace
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespaces.historyApi }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken (printf "%s:%s" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken | b64enc) | b64enc }}
---
# GHCR pull secret for history-consumer namespace
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespaces.historyConsumer }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken (printf "%s:%s" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken | b64enc) | b64enc }}
---
# GHCR pull secret for ui namespace
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespaces.ui }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken (printf "%s:%s" .Values.secrets.ghcrUsername .Values.secrets.ghcrToken | b64enc) | b64enc }}
