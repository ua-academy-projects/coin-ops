---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ .Values.namespaces.proxy }}
  labels:
    app: proxy
    {{- include "coinops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq.{{ .Values.namespaces.rabbitmq }}.svc.cluster.local {{ .Values.ports.rabbitmq }}; do
                echo "Waiting for RabbitMQ..."; sleep 3;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis.{{ .Values.namespaces.redis }}.svc.cluster.local {{ .Values.ports.redis }}; do
                echo "Waiting for Redis..."; sleep 3;
              done
      containers:
        - name: proxy
          image: {{ .Values.image.registry }}/coin-ops-proxy:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.ports.proxy }}
          envFrom:
            - secretRef:
                name: coinops-app-secret
          env:
            - name: PORT
              value: "{{ .Values.ports.proxy }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ports.proxy }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: {{ .Values.namespaces.proxy }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
spec:
  selector:
    app: proxy
  ports:
    - port: {{ .Values.ports.proxy }}
      targetPort: {{ .Values.ports.proxy }}
