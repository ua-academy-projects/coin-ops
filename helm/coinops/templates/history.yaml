---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-api
  namespace: {{ .Values.namespaces.history }}
  labels:
    app: history-api
    {{- include "coinops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-api
  template:
    metadata:
      labels:
        app: history-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: history-api
          image: {{ .Values.image.registry }}/coin-ops-history-api:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.ports.historyApi }}
          envFrom:
            - secretRef:
                name: coinops-app-secret
          env:
            - name: PORT
              value: "{{ .Values.ports.historyApi }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ports.historyApi }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: history-api
  namespace: {{ .Values.namespaces.history }}
  labels:
    {{- include "coinops.labels" . | nindent 4 }}
spec:
  selector:
    app: history-api
  ports:
    - port: {{ .Values.ports.historyApi }}
      targetPort: {{ .Values.ports.historyApi }}
