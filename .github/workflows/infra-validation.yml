permissions:
  contents: read

jobs:
  config:
    name: Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            configs
            scripts/validate_configs.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install config validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema referencing

      - name: Validate config files
        run: python3 scripts/validate_configs.py

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            configs
            terraform/cloud

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          echo "Checking Terraform formatting. If this step fails, run: terraform fmt -recursive terraform"
          terraform fmt -check -recursive terraform

      - name: Validate Terraform roots
        run: |
          for dir in terraform/cloud; do
            echo "Validating ${dir}"
            export TF_DATA_DIR="${RUNNER_TEMP}/terraform-${dir//\//-}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
          done

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            ansible

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check Ansible playbook syntax
        run: |
          ansible-playbook --syntax-check \
            ansible/vm-provision.yml \
            ansible/vm-deploy.yml \
            ansible/k3s-provision.yml \
            ansible/k3s-site.yml

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            charts

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/coin-ops

      - name: Render Helm chart
        run: helm template coin-ops charts/coin-ops

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.6.7"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            charts
            k8s

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate static Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s

      - name: Validate rendered Helm manifests
        run: helm template coin-ops charts/coin-ops | kubeconform -strict -summary -ignore-missing-schemas -
