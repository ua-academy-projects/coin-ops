name: Build Docker images

on:
  push:
    branches:
      - kurdupel
    paths:
      - ".github/workflows/docker-images.yml"
      - "proxy/**"
      - "history/**"
      - "ui-react/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      history: ${{ steps.filter.outputs.history }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'proxy/**'
            history:
              - 'history/**'
            ui:
              - 'ui-react/**'

  build-proxy:
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-proxy:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-proxy:latest

  build-history-api:
    needs: changes
    if: needs.changes.outputs.history == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./history
          file: ./history/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-history-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-history-api:latest

  build-history-consumer:
    needs: changes
    if: needs.changes.outputs.history == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./history
          file: ./history/Dockerfile.consumer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-history-consumer:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-history-consumer:latest

  build-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ui-react
          file: ./ui-react/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-ui:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/coin-ops-ui:latest