name: Validate
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, dev-Shabat-cloud]
  push:
    branches: [dev-Shabat-cloud]

permissions:
  contents: read

jobs:
  yaml:
    name: YAML lint + config schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint jsonschema pyyaml
      - name: yamllint
        run: yamllint -c .yamllint.yml .
      - name: Validate lab.yaml against schema
        run: |
          python3 - <<'PY'
          import json, yaml, jsonschema
          cfg = "terraform/multicloud-vm-yaml-lab/config/lab.yaml"
          schema = "terraform/multicloud-vm-yaml-lab/config/lab.schema.json"
          jsonschema.validate(yaml.safe_load(open(cfg)), json.load(open(schema)))
          print("lab.yaml OK")
          PY

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/multicloud-vm-yaml-lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive
      - name: terraform init (no backend) + validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-lint ansible
      - run: ansible-lint ansible/ || true   # advisory; flip to blocking once clean

  helm:
    name: Helm lint + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/coinops-app

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: git ls-files '*.sh' | xargs -r shellcheck -S warning || true
