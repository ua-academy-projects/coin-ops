# =============================================================================
# deploy/local/headlamp.yaml
# =============================================================================
# ServiceAccount + ClusterRoleBinding for Headlamp dashboard access.
#
# This creates a read-write admin SA whose token you paste into Headlamp's
# login screen. For a read-only token, replace ClusterRole "cluster-admin"
# with "view".
#
# IMPORTANT: Never use cluster-admin tokens in production clusters.
#            This is local-only.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin   # Full access — acceptable only for local dev dashboards.
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: kube-system
