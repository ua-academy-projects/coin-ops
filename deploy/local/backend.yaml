# =============================================================================
# deploy/local/backend.yaml
# =============================================================================
# Backend Deployment + ClusterIP Service for local k3d development.
#
# Uses hashicorp/http-echo as a zero-dependency API placeholder.
# It echoes a JSON-like response so you can verify routing end-to-end.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: coin-ops
  labels:
    app: backend
    env: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Lightweight echo server — returns whatever text you configure.
          # Replace with your real backend image when ready.
          image: hashicorp/http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-listen=:8080"
            - >-
              -text={"service":"backend","status":"ok","env":"local-k3d"}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: coin-ops
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
