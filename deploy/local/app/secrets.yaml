# =============================================================================
# deploy/local/app/secrets.yaml
# =============================================================================
# Kubernetes Secret holding credentials for Postgres, RabbitMQ, and Redis.
# Values match docker-compose.yml defaults.
#
# In local k3d we use plain base64. In production use ExternalSecrets or
# Sealed Secrets instead of committing real passwords.
#
# To encode a value:  echo -n "myvalue" | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: coin-ops-secrets
  namespace: coin-ops
type: Opaque
stringData:
  # Postgres
  db-user:     "cognitor"
  db-password: "changeme"
  db-name:     "cognitor"
  db-host:     "postgres"
  database-url: "postgresql://cognitor:changeme@postgres:5432/cognitor"

  # RabbitMQ
  rabbitmq-user:     "cognitor"
  rabbitmq-password: "changeme"
  rabbitmq-url:      "amqp://cognitor:changeme@rabbitmq:5672/"

  # Redis
  redis-url: "redis://redis:6379/0"
