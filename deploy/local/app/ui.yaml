# =============================================================================
# deploy/local/app/ui.yaml
# =============================================================================
# UI — React SPA served by nginx.
#
# The nginx.conf inside the image handles static files only (no proxying).
# All API routing is done by Traefik Ingress at the cluster level:
#   /api/*         → proxy:8080    (prefix stripped)
#   /history-api/* → history-api:8000  (prefix stripped)
#   /              → ui:80
#
# The runtime-config entrypoint writes window.__COIN_OPS_CONFIG__ with the
# correct URL prefixes so the React app knows where to call the APIs.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: coin-ops
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ui
          image: ${IMAGE_REGISTRY}/coin-ops-ui:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # These are consumed by docker-entrypoint.d/40-runtime-config.sh
            # which writes window.__COIN_OPS_CONFIG__ into the served HTML.
            - name: PROXY_URL
              value: "/api"
            - name: HISTORY_URL
              value: "/history-api"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: coin-ops
  labels:
    app: ui
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: http
