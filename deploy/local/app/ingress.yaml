# =============================================================================
# deploy/local/app/ingress.yaml
# =============================================================================
# Nginx Ingress for the real Coin Ops app (adapted for k3s).
# Replaces Traefik config.
#
# Routing table:
#   myapp.local/              → ui:80
#   myapp.local/api/*         → proxy:8080     (strip /api prefix)
#   myapp.local/history-api/* → history-api:8000 (strip /history-api prefix)
# =============================================================================

# Ingress for APIs (with prefix rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coin-ops-api
  namespace: coin-ops
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wrangler.pp.ua
      secretName: wrangler-tls
  rules:
    - host: wrangler.pp.ua
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: proxy
                port:
                  number: 8080
          - path: /history-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: history-api
                port:
                  number: 8000
---
# Ingress for UI (no rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coin-ops-ui
  namespace: coin-ops
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wrangler.pp.ua
      secretName: wrangler-tls
  rules:
    - host: wrangler.pp.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
