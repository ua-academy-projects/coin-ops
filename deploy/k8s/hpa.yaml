# =============================================================================
# deploy/k8s/hpa.yaml
# =============================================================================
# Horizontal Pod Autoscalers for frontend and backend.
#
# HPA works together with Cluster Autoscaler:
#   HPA scales Pods based on CPU/memory → if nodes are full, CA adds nodes.
#   When load drops, HPA removes Pods → CA eventually removes empty nodes.
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: coin-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3   # Minimum for zone-level HA.
  maxReplicas: 15  # Matches 3 zones × max_node_count(5) in the node pool.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # Scale out when average CPU > 60%.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: coin-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down (avoids thrashing).
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30  # React to spikes quickly.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
