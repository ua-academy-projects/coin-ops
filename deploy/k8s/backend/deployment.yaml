# =============================================================================
# deploy/k8s/backend/deployment.yaml
# =============================================================================
# Backend API service Deployment.
#
# This mirrors the frontend deployment pattern but is tuned for an API server:
#   • Separate resource limits (API servers are typically more CPU-bound).
#   • BACKEND_PORT / DB_HOST injected via env (secrets via Secret references).
#   • A separate KSA that will be bound to a Google SA with Cloud SQL / Secret
#     Manager access via Workload Identity.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: coin-ops
  labels:
    app: backend
    tier: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: coin-ops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: backend-ksa

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend

      terminationGracePeriodSeconds: 60  # API servers may need longer to drain.

      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/coinops/coin-ops/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Health checks ──────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          # ── Resources ──────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # ── Security context ───────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # ── Environment variables ──────────────────────────────────────────────
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            # Database host — use Cloud SQL Proxy sidecar or Cloud SQL connector.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: backend
                topologyKey: kubernetes.io/hostname
