# =============================================================================
# deploy/k3s/infra/cnpg-secrets.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-app-secret
type: kubernetes.io/basic-auth
stringData:
  username: "{{ db_user | default('cognitor') }}"
  password: "{{ db_password | default('changeme') }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-migration-secret
type: kubernetes.io/basic-auth
stringData:
  username: "{{ db_user | default('cognitor') }}"
  password: "{{ db_password | default('changeme') }}"
