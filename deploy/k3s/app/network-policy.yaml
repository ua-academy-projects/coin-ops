# =============================================================================
# deploy/k3s/app/network-policy.yaml.j2
# =============================================================================
# Kubernetes NetworkPolicies for the app namespace.
# =============================================================================

# ── Default deny all in the namespace ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}  # Applies to ALL Pods in the namespace.
  policyTypes:
    - Ingress
    - Egress

---
# ── Allow DNS resolution for all pods ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# ── UI: Allow ingress from Nginx (overlay pods + host-network node IPs) ─────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress
spec:
  podSelector:
    matchLabels:
      app: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 80
    - from:
        - ipBlock:
            cidr: "{{ node_cidr | default('10.10.1.0/24') }}"
      ports:
        - port: 80

---
# ── Proxy: Allow ingress from Nginx (overlay + host-network), egress to Infra ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-traffic
spec:
  podSelector:
    matchLabels:
      app: proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - port: 8080
    - from:
        - ipBlock:
            cidr: "{{ node_cidr | default('10.10.1.0/24') }}"
      ports:
        - port: 8080
  egress:
    - ports:
        - port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 5432

---
# ── History API: Allow ingress from Nginx (overlay + host-network), egress to Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-history-api-traffic
spec:
  podSelector:
    matchLabels:
      app: history-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
    - from:
        - ipBlock:
            cidr: "{{ node_cidr | default('10.10.1.0/24') }}"
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 5432

---
# ── History Consumer: Allow egress to RabbitMQ & Postgres ─────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-history-consumer-egress
spec:
  podSelector:
    matchLabels:
      app: history-consumer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 5432

---
# =============================================================================
# Cilium-specific: allow ingress-nginx (hostNetwork DaemonSet) to reach app pods.
#
# Standard k8s NetworkPolicy ipBlock cannot match Cilium's 'remote-node'
# identity, which is assigned to hostNetwork pods from other nodes.
# CiliumNetworkPolicy with fromEntities: [remote-node, host] covers:
#   - ingress-nginx controller pods (hostNetwork: true) on all nodes
#   - kubelet health probes originating from the node itself
# =============================================================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-nginx-to-ui
spec:
  endpointSelector:
    matchLabels:
      app: ui
  ingress:
    - fromEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-nginx-to-proxy
spec:
  endpointSelector:
    matchLabels:
      app: proxy
  ingress:
    - fromEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-nginx-to-history-api
spec:
  endpointSelector:
    matchLabels:
      app: history-api
  ingress:
    - fromEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
