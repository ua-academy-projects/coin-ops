# =============================================================================
# deploy/k3s/app/network-policy.yaml.j2
# =============================================================================
# Kubernetes NetworkPolicies for the app namespace.
# =============================================================================

# ── Default deny all in the namespace ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}  # Applies to ALL Pods in the namespace.
  policyTypes:
    - Ingress
    - Egress

---
# ── Allow DNS resolution for all pods ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# ── UI: Allow ingress from Traefik ────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress
spec:
  podSelector:
    matchLabels:
      app: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 80

---
# ── Proxy: Allow ingress from Traefik and UI, egress to Infra ─────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-traffic
spec:
  podSelector:
    matchLabels:
      app: proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432

---
# ── History API: Allow ingress from Traefik, egress to Postgres ───────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-history-api-traffic
spec:
  podSelector:
    matchLabels:
      app: history-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432

---
# ── History Consumer: Allow egress to RabbitMQ & Postgres ─────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-history-consumer-egress
spec:
  podSelector:
    matchLabels:
      app: history-consumer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ infra_namespace }}"
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
