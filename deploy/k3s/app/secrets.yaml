# =============================================================================
# deploy/k3s/app/secrets.yaml
# =============================================================================
# Kubernetes Secret holding credentials for Postgres, RabbitMQ, and Redis.
# Uses cross-namespace FQDNs so the app can reach the infra components.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: coin-ops-secrets
type: Opaque
stringData:
  # Postgres
  db-user:      "{{ db_user | default('cognitor') }}"
  db-password:  "{{ db_password | default('changeme') }}"
  db-name:      "{{ db_name | default('cognitor') }}"
  db-host:      "coin-ops-db-rw.{{ infra_namespace }}.svc.cluster.local"
  database-url: "postgresql://{{ db_user | default('cognitor') }}:{{ db_password | default('changeme') }}@coin-ops-db-rw.{{ infra_namespace }}.svc.cluster.local:5432/{{ db_name | default('cognitor') }}"

  # RabbitMQ
  rabbitmq-user:     "{{ rabbitmq_user | default('cognitor') }}"
  rabbitmq-password: "{{ rabbitmq_password | default('changeme') }}"
  rabbitmq-url:      "amqp://{{ rabbitmq_user | default('cognitor') }}:{{ rabbitmq_password | default('changeme') }}@rabbitmq.{{ infra_namespace }}.svc.cluster.local:5672/"

  # Redis
  redis-url: "redis://redis.{{ infra_namespace }}.svc.cluster.local:6379/0"
