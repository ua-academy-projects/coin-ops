# Default values for coin-ops.
# This is a YAML-formatted file.

global:
  env: "production"
  imageRegistry: "public.ecr.aws"
  security:
    allowInsecureImages: true

namespaces:
  app: "coin-ops-app"
  infra: "coin-ops-infra"

image:
  registry: "ghcr.io/ua-academy-projects"
  tag: "shabat-latest"
  pullPolicy: IfNotPresent
  pullSecret:
    enabled: true
    name: ghcr-secret
    username: ""
    password: ""

routing:
  domain: "wrangler.pp.ua"
  nodeCidr: "10.10.1.0/24"
  tls:
    clusterIssuer: "letsencrypt-prod"

cloudflare:
  tunnelToken: ""
  image:
    repository: "cloudflare/cloudflared"
    tag: "latest"

serviceAccount:
  create: true
  name: "coin-ops-sa"
  annotations: {}
    # Example for GCP Workload Identity:
    # iam.gke.io/gcp-service-account: "coin-ops-sa@YOUR_PROJECT.iam.gserviceaccount.com"
    # Example for AWS IRSA:
    # eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/coin-ops-secrets-role"

externalSecrets:
  enabled: true
  secretStoreName: "cloud-secret-store"

database:
  user: "cognitor"
  password: "changeme"

rabbitmq:
  replicaCount: 1
  auth:
    password: "changeme"

redis:
  architecture: standalone
  auth:
    password: "changeme"

# Legacy local credentials and in-cluster infrastructure have been removed for production.
# Infrastructure is managed by Terraform.
features:
  deployInfra: true
  deployApp: true
