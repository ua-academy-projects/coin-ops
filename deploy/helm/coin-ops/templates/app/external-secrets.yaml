{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/external-secrets.yaml
# =============================================================================
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: coin-ops-secrets-external
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: coin-ops-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: coinops-app-secrets
        property: DATABASE_URL
    - secretKey: rabbitmq-password
      remoteRef:
        key: coinops-app-secrets
        property: RABBITMQ_PASSWORD
    - secretKey: rabbitmq-url
      remoteRef:
        key: coinops-app-secrets
        property: RABBITMQ_URL # Need to update TF to output this or construct in proxy
{{- end }}
{{- end }}
