{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/proxy.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: proxy
  labels:
    app: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [proxy]
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: proxy
          image: "{{ .Values.image.registry }}/coin-ops-proxy:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8080"
            - name: RUNTIME_BACKEND
              value: "external"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: rabbitmq-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: proxy
  labels:
    app: proxy
spec:
  type: ClusterIP
  selector:
    app: proxy
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: proxy-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: proxy
{{- end }}
