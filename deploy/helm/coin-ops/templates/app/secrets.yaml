{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/secrets.yaml
# =============================================================================
# Kubernetes Secret holding credentials for Postgres, RabbitMQ, and Redis.
# Uses cross-namespace FQDNs so the app can reach the infra components.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: coin-ops-secrets
type: Opaque
stringData:
  # Postgres
  db-user:      "{{ .Values.database.user }}"
  db-password:  "{{ .Values.database.password }}"
  db-name:      "{{ .Values.database.name }}"
  db-host:      "coin-ops-db-rw.{{ .Values.namespaces.infra }}.svc.cluster.local"
  database-url: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@coin-ops-db-rw.{{ .Values.namespaces.infra }}.svc.cluster.local:5432/{{ .Values.database.name }}"

  # RabbitMQ
  rabbitmq-user:     "{{ .Values.rabbitmq.auth.username }}"
  rabbitmq-password: "{{ .Values.rabbitmq.auth.password }}"
  rabbitmq-url:      "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@rabbitmq.{{ .Values.namespaces.infra }}.svc.cluster.local:5672/"

  # Redis
  redis-url: "redis://redis-master.{{ .Values.namespaces.infra }}.svc.cluster.local:6379/0"

{{- end }}
