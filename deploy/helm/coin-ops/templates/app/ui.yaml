{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/ui.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: ui
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [ui]
                topologyKey: kubernetes.io/hostname

      containers:
        - name: ui
          image: "{{ .Values.image.registry }}/coin-ops-ui:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80

          env:
            - name: PROXY_URL
              value: "/api"
            - name: HISTORY_URL
              value: "/history-api"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: ui
  labels:
    app: ui
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: ui-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ui

{{- end }}
