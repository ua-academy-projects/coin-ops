{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/history.yaml
# =============================================================================
# history-api  — Python/FastAPI REST service (port 8000)
# history-consumer — Python worker that consumes from RabbitMQ
#
# Both share the same image (built from Dockerfile.api / Dockerfile.consumer).
# =============================================================================

# ── history-api ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-api
  labels:
    app: history-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-api
  template:
    metadata:
      labels:
        app: history-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: history-api
          image: "{{ .Values.image.registry }}/coin-ops-history-api:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: RUNTIME_BACKEND
              value: "external"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-api
  labels:
    app: history-api
spec:
  type: ClusterIP
  selector:
    app: history-api
  ports:
    - name: http
      port: 8000
      targetPort: http

---
# ── history-consumer ──────────────────────────────────────────────────────────
# Worker — no HTTP port, no Service needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-consumer
  labels:
    app: history-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-consumer
  template:
    metadata:
      labels:
        app: history-consumer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: history-consumer
          image: "{{ .Values.image.registry }}/coin-ops-history-consumer:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNTIME_BACKEND
              value: "external"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: coin-ops-secrets
                  key: rabbitmq-url
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

{{- end }}
