{{- if .Values.features.deployApp }}
# =============================================================================
# deploy/k3s/app/history.yaml
# =============================================================================

# ── history-api ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-api
  labels:
    app: history-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-api
  template:
    metadata:
      labels:
        app: history-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [history-api]
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: history-api
          image: "{{ .Values.image.registry }}/coin-ops-history-api:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8000"
            - name: RUNTIME_BACKEND
              value: "external"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@coin-ops-db-rw.coin-ops-infra.svc.cluster.local:5432/cognitor"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-api
  labels:
    app: history-api
spec:
  type: ClusterIP
  selector:
    app: history-api
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: history-api

---
# ── history-consumer ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-consumer
  labels:
    app: history-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-consumer
  template:
    metadata:
      labels:
        app: history-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [history-consumer]
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: history-consumer
          image: "{{ .Values.image.registry }}/coin-ops-history-consumer:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RUNTIME_BACKEND
              value: "external"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@coin-ops-db-rw.coin-ops-infra.svc.cluster.local:5432/cognitor"
            - name: RABBITMQ_URL
              value: "amqp://user:{{ .Values.rabbitmq.auth.password }}@coin-ops-rabbitmq.coin-ops-infra.svc.cluster.local:5672/"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Values.namespaces.app }}
  name: history-consumer-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: history-consumer

{{- end }}
