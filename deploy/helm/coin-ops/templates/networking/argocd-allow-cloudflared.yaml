apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-to-argocd
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coin-ops-infra
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8080
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
