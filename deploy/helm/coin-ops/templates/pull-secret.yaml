{{- if and .Values.image.pullSecret.enabled .Values.externalSecrets.enabled }}
# Fetch the Docker registry credentials from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret.name }}
  namespace: {{ .Values.namespaces.app }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{{ .dockerconfigjson }}` }}'
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: coinops-ghcr-dockerconfig
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret.name }}
  namespace: {{ .Values.namespaces.infra }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{{ .dockerconfigjson }}` }}'
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: coinops-ghcr-dockerconfig
{{- end }}
