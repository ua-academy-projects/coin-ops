apiVersion: v2
name: coin-ops
description: A Helm chart for the Coin Ops application and infrastructure
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: redis
    version: "25.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
  - name: rabbitmq
    version: "16.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: rabbitmq.enabled
