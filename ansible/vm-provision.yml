# –> install system packages on all VMs.

---
- name: Load shared deployment config
  hosts: all
  gather_facts: false
  roles:
    - shared_config

- name: Common setup — public nodes
  hosts: bastion:ui:nat
  become: yes
  roles:
    - common
    - docker

- name: Provision NAT node
  hosts: nat
  become: yes
  roles:
    - nat

- name: Common setup — private nodes
  hosts: history:proxy
  become: yes
  roles:
    - common
    - docker

- name: Provision history node — Data directories
  hosts: history
  become: yes
  tasks:
    - name: Create PostgreSQL data directory
      file:
        path: /var/lib/coin-ops/postgres
        state: directory
        owner: 70
        group: 70
        mode: '0700'

    - name: Create RabbitMQ data directory
      file:
        path: /var/lib/coin-ops/rabbitmq
        state: directory
        owner: 999
        group: 999
        mode: '0755'

- name: Provision proxy node — Data directories
  hosts: proxy
  become: yes
  tasks:
    - name: Create Redis data directory
      file:
        path: /var/lib/coin-ops/redis
        state: directory
        owner: 999
        group: 999
        mode: '0755'

- name: Provision UI node
  hosts: ui
  become: yes
  tasks:
    - name: No host-level provisioning required for UI node
      debug:
        msg: "UI node only needs Docker."
