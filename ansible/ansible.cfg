[defaults]
# Default to GCP (primary cloud). Override with -i for other clouds:
#   ansible-playbook playbooks/deploy.yml                          (GCP — default)
#   ansible-playbook playbooks/deploy.yml -i inventories/aws       (AWS)
#   ansible-playbook playbooks/deploy.yml -i inventories/azure     (Azure)
inventory         = inventories/gcp
roles_path        = roles
collections_path  = ~/.ansible/collections


# Vault
# Encrypt per-cloud vault files with:
#   ansible-vault encrypt inventories/gcp/group_vars/all/vault.yml
# Then run playbooks with:
#   ansible-playbook playbooks/deploy.yml --ask-vault-pass
# Or set this file to avoid the prompt:
# vault_password_file = ~/.vault_pass

# Performance
gathering         = smart
fact_caching      = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Output
stdout_callback   = default
callbacks_enabled = profile_tasks
interpreter_python = /Library/Frameworks/Python.framework/Versions/3.12/bin/python3

[inventory]
# Register the custom dynamic-inventory plugins directory.
enable_plugins = host_list, script, yaml, ini, auto, google.cloud.gcp_compute, azure.azcollection.azure_rm

[ssh_connection]
ssh_args          = -C -o ControlMaster=auto -o ControlPersist=60s
pipelining        = True
