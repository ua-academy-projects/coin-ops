---
# provision.yml — install system packages on all VMs.
# Run once (or re-run: idempotent).
#
#   source .env
#   ansible-playbook ansible/provision.yml

- name: Validate required environment variables
  hosts: localhost
  connection: local
  tasks:
    - name: Check required variables are set
      assert:
        that:
          - (RABBITMQ_PASSWORD | default('') | length > 0)
          - (DB_PASSWORD | default('') | length > 0)
          - (SSH_KEY_PATH | default('') | length > 0)
          - (RUNTIME_BACKEND | default('external')) in ['external', 'postgres']
        fail_msg: |
          Required variables (RABBITMQ_PASSWORD, DB_PASSWORD, SSH_KEY_PATH) are not set.
          If running manually:  source .env
          If running via Packer: Check pkr.hcl extra_arguments.

- name: Provision Bastion node — Proxy (Run First)
  hosts: bastion
  become: yes
  roles:
    - squid

- name: Common setup — all nodes
  hosts: all
  become: yes
  environment:
    http_proxy: "{{ app_http_proxy if inventory_hostname not in groups.get('bastion', []) else '' }}"
    https_proxy: "{{ app_http_proxy if inventory_hostname not in groups.get('bastion', []) else '' }}"
    no_proxy: "{{ app_no_proxy if inventory_hostname not in groups.get('bastion', []) else '' }}"
  roles:
    - common
    - docker

- name: Provision history node — Data directories
  hosts: history
  become: yes
  tasks:
    - name: Create PostgreSQL data directory
      file:
        path: /var/lib/coin-ops/postgres
        state: directory
        owner: 70
        group: 70
        mode: '0700'

    - name: Create RabbitMQ data directory
      file:
        path: /var/lib/coin-ops/rabbitmq
        state: directory
        owner: 999
        group: 999
        mode: '0755'

- name: Provision proxy node — Data directories
  hosts: proxy
  become: yes
  tasks:
    - name: Create Redis data directory
      file:
        path: /var/lib/coin-ops/redis
        state: directory
        owner: 999
        group: 999
        mode: '0755'

- name: Provision UI node
  hosts: ui
  become: yes
  tasks:
    - name: No host-level provisioning required for UI node
      debug:
        msg: "UI node only needs Docker."
