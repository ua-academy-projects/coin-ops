---
# Installs Headlamp Kubernetes UI via Helm.
# Access via Tailscale only: headlamp.coinops-softserve-penina.pp.ua (Tailscale IP required)
# Or via port-forward: kubectl port-forward -n headlamp svc/headlamp 8080:80

- name: Add Headlamp Helm repo
  kubernetes.core.helm_repository:
    name: headlamp
    repo_url: https://kubernetes-sigs.github.io/headlamp/

- name: Install Headlamp via Helm
  kubernetes.core.helm:
    name: headlamp
    chart_ref: headlamp/headlamp
    release_namespace: "{{ headlamp_namespace }}"
    create_namespace: true
    wait: true
    timeout: 5m
    # values:
    #   replicaCount: 2

- name: Create Tailscale whitelist middleware
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      # Middleware = Traefik plugin that runs before routing request to service
      # IPAllowList = blocks all IPs except the ones listed
      kind: Middleware
      metadata:
        name: tailscale-only
        namespace: "{{ headlamp_namespace }}"
      spec:
        ipAllowList:
          # 100.64.0.0/10 = entire Tailscale IP range
          # Only devices in your Tailnet can reach Headlamp
          sourceRange:
            - 100.64.0.0/10

- name: Create Ingress for Headlamp via Tailscale only
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: headlamp-tailscale
        namespace: "{{ headlamp_namespace }}"
        annotations:
          # Apply the middleware — blocks non-Tailscale IPs
          traefik.ingress.kubernetes.io/router.middlewares: "{{ headlamp_namespace }}-tailscale-only@kubernetescrd"
          cert-manager.io/cluster-issuer: letsencrypt-prod
      spec:
        ingressClassName: traefik
        rules:
          - host: "{{ headlamp_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: headlamp
                      port:
                        number: 80
        tls:
          - hosts:
              - "{{ headlamp_domain }}"
            secretName: headlamp-tls