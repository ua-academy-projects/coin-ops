---
# defaults file for /tmp/role_skeleton
history_db_name: cognitor
history_db_user: cognitor
history_db_password: "{{ fetched_gsm_secrets.db_password | default(lookup('env', 'DB_PASSWORD'), true) }}"
history_runtime_backend: "{{ runtime_backend | default('external') }}"
history_rabbitmq_user: cognitor
history_rabbitmq_password: "{{ fetched_gsm_secrets.rabbitmq_password | default(lookup('env', 'RABBITMQ_PASSWORD'), true) }}"
history_postgres_bind_ip: "{{ hostvars[groups['history'][0]].private_ip }}"
history_external_db_host: "{{ external_db_host | default(deploy_config_deploy.external_db_host | default('')) }}"
history_external_db_enabled: "{{ history_external_db_host | length > 0 }}"
history_database_host: "{{ history_external_db_host if history_external_db_host | length > 0 else 'postgres' }}"
history_database_url: "postgresql://{{ history_db_user }}:{{ history_db_password }}@{{ history_database_host }}:5432/{{ history_db_name }}"
history_port: 8000
history_image_registry: "{{ deploy_config_deploy.image_registry | default('ghcr.io/ua-academy-projects') }}"
history_image_tag: "{{ deploy_config_deploy.image_tag | default('shabat-latest') }}"
history_api_image: "{{ history_image_registry }}/coin-ops-history-api:{{ history_image_tag }}"
history_consumer_image: "{{ history_image_registry }}/coin-ops-history-consumer:{{ history_image_tag }}"
history_postgres_runtime_image: "{{ history_image_registry }}/coin-ops-postgres-runtime:{{ history_image_tag }}"
history_postgres_image: "{{ history_postgres_runtime_image if history_runtime_backend == 'postgres' else 'postgres:16-alpine' }}"
