---
# =============================================================================
# roles/history/tasks/main.yml
# =============================================================================

- name: Check for existing containerized PostgreSQL data
  ansible.builtin.stat:
    path: /var/lib/coin-ops/postgres/PG_VERSION
  register: container_postgres_pg_version

- name: Check for completed host PostgreSQL migration
  ansible.builtin.stat:
    path: /var/lib/coin-ops/postgres/.migrated-from-host
  register: host_postgres_migration_marker

- name: Check for legacy host PostgreSQL data
  ansible.builtin.shell: >-
    find /var/lib/postgresql -mindepth 3 -maxdepth 3 -name PG_VERSION -print -quit 2>/dev/null
  register: legacy_postgres_pg_version
  changed_when: false
  failed_when: false

- name: Create migration backup directory
  ansible.builtin.file:
    path: /var/backups/coin-ops
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  when:
    - legacy_postgres_pg_version.stdout != ''
    - not container_postgres_pg_version.stat.exists
    - not host_postgres_migration_marker.stat.exists

- name: Ensure legacy PostgreSQL is running for one-time dump
  ansible.builtin.service:
    name: postgresql
    state: started
  when:
    - legacy_postgres_pg_version.stdout != ''
    - not container_postgres_pg_version.stat.exists
    - not host_postgres_migration_marker.stat.exists
  failed_when: false

- name: Dump legacy application database before container cutover
  become_user: postgres
  ansible.builtin.command: >-
    pg_dump --clean --if-exists --no-owner --no-acl
    -d {{ db_name }} -f /var/backups/coin-ops/pre-container-postgres.sql
  when:
    - legacy_postgres_pg_version.stdout != ''
    - not container_postgres_pg_version.stat.exists
    - not host_postgres_migration_marker.stat.exists

- name: Stop and disable legacy host services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - postgresql
    - rabbitmq-server
    - cognitor-history-consumer
    - cognitor-history-api
  failed_when: false

- name: Create secrets and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - /etc/cognitor
    - /opt/coinops

- name: Install postgresql-client for Cloud DB management
  ansible.builtin.apt:
    name: postgresql-client
    state: present
    update_cache: true
  when: use_cloud_db

- name: Write history environment file
  ansible.builtin.template:
    src: history.env.j2
    dest: /etc/cognitor/history.env
    owner: root
    group: root
    mode: '0640'
  notify: restart history services

- name: Write application configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/coinops/config.yaml
    owner: root
    group: root
    mode: '0644'
  notify: restart history services

- name: Create history deploy directory
  ansible.builtin.file:
    path: /opt/cognitor/history
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Remove legacy synced history source
  ansible.builtin.file:
    path: /opt/cognitor/history/history
    state: absent

- name: Copy PostgreSQL runtime schema
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../history/schema.sql"
    dest: /opt/cognitor/history/schema.sql
    owner: root
    group: root
    mode: '0644'

- name: Copy runtime SQL schema files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../runtime/"
    dest: /opt/cognitor/history/runtime/
    owner: root
    group: root
    mode: '0644'

- name: Render compose file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../deploy/compose/node-01.compose.yaml"
    dest: /opt/cognitor/history/compose.yaml

- name: Validate history compose configuration
  ansible.builtin.command: docker compose -f /opt/cognitor/history/compose.yaml config -q
  args:
    chdir: /opt/cognitor/history
  changed_when: false

- name: Stop PostgreSQL before repairing data directory ownership
  ansible.builtin.command: docker compose -f /opt/cognitor/history/compose.yaml stop postgres
  args:
    chdir: /opt/cognitor/history
  changed_when: false
  failed_when: false

- name: Repair data directory ownership for container users (external backend)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    recurse: true
  loop:
    - { path: '/var/lib/coin-ops/rabbitmq', owner: '999' }
    - { path: '/var/lib/coin-ops/postgres', owner: '999' }
  when: runtime_backend == 'external'

- name: Repair PostgreSQL data directory ownership for local runtime image
  ansible.builtin.file:
    path: /var/lib/coin-ops/postgres
    state: directory
    # Keep runtime image on Alpine-compatible uid/gid 70 so existing
    # postgres volumes can be reused during external → postgres cutover.
    owner: '70'
    group: '70'
    mode: '0700'
    recurse: true
  when: not use_cloud_db

- name: Stop all history services before repair
  ansible.builtin.command: docker compose -f /opt/cognitor/history/compose.yaml down
  args:
    chdir: /opt/cognitor/history
  failed_when: false
  changed_when: false
  when: runtime_backend == 'external'

# The .erlang.cookie file inside the RabbitMQ volume must be owned by
# UID 999 (rabbitmq). Force-wipe and recreate the entire directory.
- name: Wipe RabbitMQ volume (clears stale .erlang.cookie ownership)
  ansible.builtin.file:
    path: /var/lib/coin-ops/rabbitmq
    state: absent
  when: runtime_backend == 'external'

- name: Re-create RabbitMQ data directory with correct ownership
  ansible.builtin.file:
    path: /var/lib/coin-ops/rabbitmq
    state: directory
    owner: '999'
    group: '999'
    mode: '0700'
  when: runtime_backend == 'external'

- name: Pull history container images
  ansible.builtin.command: docker compose -f /opt/cognitor/history/compose.yaml pull
  args:
    chdir: /opt/cognitor/history

- name: Start history dependencies first (postgres / rabbitmq)
  ansible.builtin.command: >-
    docker compose -f /opt/cognitor/history/compose.yaml up -d
    {% if not use_cloud_db %}postgres{% endif %}{% if runtime_backend == "external" %} rabbitmq{% endif %}
  args:
    chdir: /opt/cognitor/history
  when: not use_cloud_db or runtime_backend == "external"

- name: Wait for RabbitMQ to become healthy
  ansible.builtin.command: >-
    docker inspect --format='{% raw %}{{.State.Health.Status}}{% endraw %}' history-rabbitmq-1
  register: rabbitmq_ready
  until: rabbitmq_ready.stdout == 'healthy'
  retries: 18
  delay: 10
  when: runtime_backend == 'external'

- name: Wait for containerized PostgreSQL readiness
  ansible.builtin.command: >-
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres
    pg_isready -U {{ db_user }} -d {{ db_name }}
  args:
    chdir: /opt/cognitor/history
  retries: 12
  delay: 5
  register: postgres_ready
  until: postgres_ready.rc == 0
  when: not use_cloud_db

- name: Check for legacy dump file
  ansible.builtin.stat:
    path: /var/backups/coin-ops/pre-container-postgres.sql
  register: legacy_postgres_dump

- name: Restore legacy PostgreSQL dump into container
  ansible.builtin.shell: >-
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres
    psql -U {{ db_user }} -d {{ db_name }}
    < /var/backups/coin-ops/pre-container-postgres.sql
  args:
    chdir: /opt/cognitor/history
  when:
    - legacy_postgres_dump.stat.exists
    - not host_postgres_migration_marker.stat.exists
    - not use_cloud_db

# ── Schema application ─────────────────────────────────────────────────────────
# SECURITY: db_password is passed via environment variable, NOT in the shell
# command string, so it does not appear in `ps aux` or Ansible logs.
# no_log: true suppresses the task output to prevent token leakage.

- name: Apply PostgreSQL runtime schema (cloud DB)
  ansible.builtin.shell: |
    psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }} \
      -v ON_ERROR_STOP=1 < /opt/cognitor/history/schema.sql
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
  args:
    chdir: /opt/cognitor/history
  register: schema_result
  changed_when: false
  when: use_cloud_db

- name: Apply PostgreSQL runtime schema (local container)
  ansible.builtin.shell: |
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres \
      psql -v ON_ERROR_STOP=1 -U {{ db_user }} -d {{ db_name }} \
      < /opt/cognitor/history/schema.sql
  args:
    chdir: /opt/cognitor/history
  register: schema_result_local
  changed_when: false
  when: not use_cloud_db

- name: Persist runtime application role (cloud DB)
  ansible.builtin.shell: >-
    psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }}
    -v ON_ERROR_STOP=1
    -c "ALTER DATABASE {{ db_name }} SET runtime.app_role = '{{ db_user }}';"
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
  args:
    chdir: /opt/cognitor/history
  register: runtime_app_role_result
  changed_when: false
  when:
    - runtime_backend == "postgres"
    - use_cloud_db

- name: Persist runtime application role (local container)
  ansible.builtin.shell: >-
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres psql
    -v ON_ERROR_STOP=1 -U {{ db_user }} -d {{ db_name }}
    -c "ALTER DATABASE {{ db_name }} SET runtime.app_role = '{{ db_user }}';"
  args:
    chdir: /opt/cognitor/history
  register: runtime_app_role_result_local
  changed_when: false
  when:
    - runtime_backend == "postgres"
    - not use_cloud_db

- name: Apply runtime queue and session schema (cloud DB)
  ansible.builtin.shell: |
    (
      printf "%s\n" "SET runtime.app_role = '{{ db_user }}';"
      cat \
        /opt/cognitor/history/runtime/01_schema.sql \
        /opt/cognitor/history/runtime/02_wrappers.sql \
        /opt/cognitor/history/runtime/03_notify.sql \
        /opt/cognitor/history/runtime/04_advisory.sql \
        /opt/cognitor/history/runtime/05_dlq.sql \
        /opt/cognitor/history/runtime/06_cache_schema.sql \
        /opt/cognitor/history/runtime/07_cache_wrappers.sql \
        /opt/cognitor/history/runtime/08_cron.sql
    ) | psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }} -v ON_ERROR_STOP=1
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
  args:
    chdir: /opt/cognitor/history
  register: runtime_schema_result
  changed_when: false
  when: runtime_backend == "postgres" and use_cloud_db

- name: Apply runtime queue and session schema (local container)
  ansible.builtin.shell: |
    (
      printf "%s\n" "SET runtime.app_role = '{{ db_user }}';"
      cat \
        /opt/cognitor/history/runtime/01_schema.sql \
        /opt/cognitor/history/runtime/02_wrappers.sql \
        /opt/cognitor/history/runtime/03_notify.sql \
        /opt/cognitor/history/runtime/04_advisory.sql \
        /opt/cognitor/history/runtime/05_dlq.sql \
        /opt/cognitor/history/runtime/06_cache_schema.sql \
        /opt/cognitor/history/runtime/07_cache_wrappers.sql \
        /opt/cognitor/history/runtime/08_cron.sql
    ) | docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres \
        psql -v ON_ERROR_STOP=1 -U {{ db_user }} -d {{ db_name }}
  args:
    chdir: /opt/cognitor/history
  register: runtime_schema_result_local
  changed_when: false
  when: runtime_backend == "postgres" and not use_cloud_db

- name: Verify PostgreSQL runtime extensions are installed (cloud DB)
  ansible.builtin.shell: >-
    psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }}
    -v ON_ERROR_STOP=1 -At
    -c "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname IN ('pg_cron', 'pgmq');"
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
  args:
    chdir: /opt/cognitor/history
  register: runtime_extension_check
  changed_when: false
  failed_when: runtime_extension_check.stdout | trim != "pg_cron,pgmq"
  when: runtime_backend == "postgres" and use_cloud_db

- name: Verify PostgreSQL runtime extensions are installed (local container)
  ansible.builtin.shell: >-
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres
    psql -v ON_ERROR_STOP=1 -At -U {{ db_user }} -d {{ db_name }}
    -c "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname IN ('pg_cron', 'pgmq');"
  args:
    chdir: /opt/cognitor/history
  register: runtime_extension_check_local
  changed_when: false
  failed_when: runtime_extension_check_local.stdout | trim != "pg_cron,pgmq"
  when: runtime_backend == "postgres" and not use_cloud_db

- name: Verify PostgreSQL runtime cron jobs are registered (cloud DB)
  ansible.builtin.shell: >-
    psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }}
    -v ON_ERROR_STOP=1 -At
    -c "SELECT count(*) FROM cron.job WHERE jobname IN ('runtime-cache-reap', 'runtime-session-reap', 'runtime-dlq-reap') AND active;"
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
  args:
    chdir: /opt/cognitor/history
  register: runtime_cron_check
  changed_when: false
  failed_when: runtime_cron_check.stdout | trim | int != 3
  when: runtime_backend == "postgres" and use_cloud_db

- name: Verify PostgreSQL runtime cron jobs are registered (local container)
  ansible.builtin.shell: >-
    docker compose -f /opt/cognitor/history/compose.yaml exec -T postgres
    psql -v ON_ERROR_STOP=1 -At -U {{ db_user }} -d {{ db_name }}
    -c "SELECT count(*) FROM cron.job WHERE jobname IN ('runtime-cache-reap', 'runtime-session-reap', 'runtime-dlq-reap') AND active;"
  args:
    chdir: /opt/cognitor/history
  register: runtime_cron_check_local
  changed_when: false
  failed_when: runtime_cron_check_local.stdout | trim | int != 3
  when: runtime_backend == "postgres" and not use_cloud_db

- name: Mark legacy PostgreSQL migration complete
  ansible.builtin.file:
    path: /var/lib/coin-ops/postgres/.migrated-from-host
    state: touch
    mode: '0644'
  when:
    - legacy_postgres_dump.stat.exists
    - not host_postgres_migration_marker.stat.exists

- name: Start all history services
  ansible.builtin.command: >-
    docker compose -f /opt/cognitor/history/compose.yaml up -d --remove-orphans
  args:
    chdir: /opt/cognitor/history

- name: Wait for history-api health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ history_port }}/health"
    method: GET
    status_code: 200
  retries: 7
  delay: 5
  register: result
  until: result.status == 200

- name: Remove dangling Docker images
  ansible.builtin.command: docker image prune -f
  changed_when: false
