---
# k3s-homepage — deploy the Homepage dashboard (gethomepage.dev) and expose it
# through Traefik with TLS. This is the worked example of the "deploy & expose"
# role pattern: one role == Namespace + ConfigMap + Deployment + Service +
# Ingress(TLS), all applied with kubernetes.core.k8s. Copy this role's shape to
# stand up any other app. Self-contained: every input is declared here.

# First-node guard (runs once; joiners exit) + kubeconfig the modules use.
k3s_first_node: "{{ ansible_play_hosts_all[0] }}"
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Ingress / TLS — shared with k3s-cert-manager. The host is <name>.<domain>;
# the annotation points Traefik at the cert-manager ClusterIssuer.
k3s_ingress_domain: "{{ coinops_k3s_ingress_domain | default('lab.coinops.pp.ua', true) }}"
cert_manager_cluster_issuer: letsencrypt-cloudflare

# Homepage workload.
homepage_namespace: homepage
homepage_image: "ghcr.io/gethomepage/homepage:latest"
homepage_replicas: 1
homepage_host: "homepage.{{ k3s_ingress_domain }}"
