---
# Deploy the Homepage dashboard and expose it through Traefik with TLS — the
# worked example of the "deploy & expose" pattern. One template renders the
# whole stack (Namespace + ConfigMap + Deployment + Service + Ingress); we
# split the documents and apply each with kubernetes.core.k8s. Runs once on the
# first node; joiners exit.

- name: Skip k3s-homepage (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Apply Homepage manifests (namespace, config, deployment, service, ingress)
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
  loop: "{{ lookup('template', 'homepage.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Report Homepage URL
  ansible.builtin.debug:
    msg:
      - "Homepage exposed at https://{{ homepage_host }} (cert via {{ cert_manager_cluster_issuer }})."
      - "Reachable once *.{{ k3s_ingress_domain }} resolves to a k3s node IP from your tailnet client."
