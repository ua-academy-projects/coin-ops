---
# =============================================================================
# roles/k3s_deploy/tasks/main.yml
# =============================================================================

# ── 1. Pre-flight Check ────────────────────────────────────────────────────────
- name: Verify connection to cloud K3s cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
  register: ns_info
  failed_when: ns_info is failed

# ── 2. Apply Namespace Manifests ──────────────────────────────────────────────
- name: Create cluster namespaces (app, infra, routing)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../deploy/k3s/cluster/namespaces.yaml"

# ── 3. Apply cert-manager ClusterIssuer ────────────────────────────────────────
- name: Apply ClusterIssuer for automated TLS
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../deploy/k3s/cluster/cluster-issuer.yaml"

# ── 4. Setup GHCR Secrets ──────────────────────────────────────────────────────
- name: Configure GHCR Pull Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: "{{ item }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ {
          'auths': {
            'ghcr.io': {
              'username': ghcr_username,
              'password': ghcr_token,
              'auth': (ghcr_username + ':' + ghcr_token) | b64encode
            }
          }
        } | to_json }}"
  loop:
    - "{{ app_namespace }}"
    - "{{ infra_namespace }}"
  when:
    - ghcr_username | length > 0
    - ghcr_token | length > 0
  no_log: true

# ── 5. Setup App connection strings ─────────────────────────────────────────────
- name: Apply Connection Secrets across namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ item }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/app/secrets.yaml"
  loop:
    - "{{ app_namespace }}"
    - "{{ infra_namespace }}"

# ── 6. Setup Network Policies ──────────────────────────────────────────────────
- name: Apply Network Policies for Infra namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ infra_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/infra/network-policy.yaml"

- name: Apply Network Policies for App namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ app_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/app/network-policy.yaml"

# ── 7. Deploy Stateful Services (Infra) ────────────────────────────────────────
- name: Deploy Postgres Persistent DB
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ infra_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/infra/postgres.yaml"

- name: Deploy Redis and RabbitMQ Message Brokering
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ infra_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/infra/infra.yaml"

# ── 8. Wait for Stateful Services ──────────────────────────────────────────────
- name: Wait for Postgres, Redis, and RabbitMQ to become active
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ infra_namespace }}"
    name: "{{ item }}"
  register: deploy_info
  until:
    - deploy_info.resources | length > 0
    - deploy_info.resources[0].status.readyReplicas | default(0) == deploy_info.resources[0].status.replicas | default(1)
  retries: 24
  delay: 5
  loop:
    - postgres
    - rabbitmq
    - redis

# ── 9. Deploy Stateless Applications (App) ──────────────────────────────────────
- name: Deploy Go Proxy Gateway
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ app_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/app/proxy.yaml"

- name: Deploy FastAPI and RabbitMQ History Worker
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ app_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/app/history.yaml"

- name: Deploy Web UI SPA
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ app_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/app/ui.yaml"

# ── 10. Wait for Stateless Applications ──────────────────────────────────────────
- name: Wait for App Deployments to become active
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ app_namespace }}"
    name: "{{ item }}"
  register: app_deploy_info
  until:
    - app_deploy_info.resources | length > 0
    - app_deploy_info.resources[0].status.readyReplicas | default(0) == app_deploy_info.resources[0].status.replicas | default(1)
  retries: 24
  delay: 5
  loop:
    - proxy
    - history-api
    - history-consumer
    - ui

# ── 11. Deploy Ingress routing ──────────────────────────────────────────────────
- name: Deploy Nginx Ingress Controller Routing Rules
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ app_namespace }}"
    src: "{{ playbook_dir }}/../../deploy/k3s/ingress/ingress.yaml"
