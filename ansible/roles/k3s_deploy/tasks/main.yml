---
# =============================================================================
# roles/k3s_deploy/tasks/main.yml
# =============================================================================

# ── 1. Pre-flight Check ────────────────────────────────────────────────────────
- name: Verify connection to cloud K3s cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
  register: ns_info
  failed_when: ns_info is failed

# ── 2. Apply Namespace Manifests ──────────────────────────────────────────────
- name: Create cluster namespaces (app, infra, routing)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    template: "{{ playbook_dir }}/../../deploy/k3s/cluster/namespaces.yaml"

# ── 3. Apply cert-manager ClusterIssuer ────────────────────────────────────────
- name: Apply ClusterIssuer for automated TLS
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    template: "{{ playbook_dir }}/../../deploy/k3s/cluster/cluster-issuer.yaml"

# ── 4. Setup GHCR Secrets ──────────────────────────────────────────────────────
- name: Configure GHCR Pull Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: "{{ item }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ {
          'auths': {
            'ghcr.io': {
              'username': ghcr_username,
              'password': ghcr_token,
              'auth': (ghcr_username + ':' + ghcr_token) | b64encode
            }
          }
        } | to_json }}"
  loop:
    - "{{ app_namespace }}"
    - "{{ infra_namespace }}"
  when:
    - ghcr_username | length > 0
    - ghcr_token | length > 0
  no_log: true

# ── 5. Install External Secrets Operator ───────────────────────────────────────
- name: Install External Secrets Operator via Helm
  ansible.builtin.command: >
    helm upgrade --install external-secrets external-secrets
    -n external-secrets --create-namespace
    --set installCRDs=true
    --repo https://charts.external-secrets.io
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Wait for External Secrets Operator to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: external-secrets
    name: external-secrets
  register: eso_deploy_info
  until:
    - eso_deploy_info.resources | length > 0
    - eso_deploy_info.resources[0].status.readyReplicas | default(0) > 0
  retries: 24
  delay: 5

- name: Create ClusterSecretStore for GCP Secret Manager
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: cloud-secret-store
      spec:
        provider:
          gcpsm:
            projectID: "coinops"
  ignore_errors: true # Fails gracefully if not on GCP

- name: Create ClusterSecretStore for AWS Secrets Manager
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: cloud-secret-store-aws
      spec:
        provider:
          aws:
            service: SecretsManager
            region: us-east-1
  ignore_errors: true # Fails gracefully if not on AWS

# ── 6.5 Deploy CloudNativePG Operator ──────────────────────────────────────────
- name: Download CloudNativePG Operator manifest
  ansible.builtin.command:
    cmd: curl -sL https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.23/releases/cnpg-1.23.0.yaml -o /tmp/cnpg-operator.yaml
  changed_when: false

- name: Apply CloudNativePG Operator
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/cnpg-operator.yaml

- name: Wait for CloudNativePG Operator to become ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: cnpg-system
    name: cnpg-controller-manager
  register: cnpg_deploy_info
  until:
    - cnpg_deploy_info.resources | length > 0
    - cnpg_deploy_info.resources[0].status.readyReplicas | default(0) > 0
  retries: 24
  delay: 5


# ── 12. Deploy ArgoCD (GitOps Bootstrapping) ────────────────────────────────────
- name: Create argocd namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Download ArgoCD stable manifest
  ansible.builtin.command:
    cmd: curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml -o /tmp/argocd-install.yaml
  changed_when: false

- name: Install ArgoCD (Server-Side Apply to avoid conflicts)
  ansible.builtin.command:
    cmd: kubectl apply --server-side --force-conflicts -n argocd -f /tmp/argocd-install.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Wait for ArgoCD Server Deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: argocd
    name: argocd-server
  register: argocd_deploy_info
  until:
    - argocd_deploy_info.resources | length > 0
    - argocd_deploy_info.resources[0].status.readyReplicas | default(0) > 0
  retries: 30
  delay: 5

- name: Configure ArgoCD Public URL
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: argocd
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: "https://argo.wrangler.pp.ua"

- name: Configure ArgoCD App of Apps (coin-ops GitOps)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: argocd
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: coin-ops
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: 'https://github.com/ua-academy-projects/coin-ops.git'
          path: deploy/helm/coin-ops
          targetRevision: dev-Tsyhan
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: coin-ops-infra
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
