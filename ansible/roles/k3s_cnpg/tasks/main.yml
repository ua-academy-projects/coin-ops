---
# Installs CNPG operator via Helm.
# CNPG = CloudNativePG — runs PostgreSQL as native Kubernetes workload.
# Only installs the operator — cluster and secrets are managed by Helm chart.

# Step 1 — install CNPG operator
- name: Add CNPG Helm repository
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts

- name: Install CNPG operator via Helm
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    release_namespace: cnpg-system
    create_namespace: true
    wait: true
    timeout: 5m
    values:
      replicaCount: 1

# Step 2 — wait for operator to be ready before Helm deploys the cluster
- name: Wait for CNPG operator pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: cnpg-system
    label_selectors:
      - app.kubernetes.io/name=cloudnative-pg
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120