---
# k3s-cnpg — install the CloudNativePG operator via Helm. CNPG manages
# PostgreSQL declaratively as a `Cluster` custom resource (primary + replicas,
# automated failover, in-cluster TLS, rolling minor upgrades), replacing the
# hand-rolled postgres StatefulSet. This role only stands up the operator; the
# actual Cluster CR is declared by k3s-coinops-data. Native modules only.

# First-node guard (runs once; joiners exit) + kubeconfig the modules use.
k3s_first_node: "{{ ansible_play_hosts_all[0] }}"
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Helm chart coordinates.
k3s_cnpg_chart_repo_name: cnpg
k3s_cnpg_chart_repo_url: https://cloudnative-pg.github.io/charts
k3s_cnpg_chart_ref: cnpg/cloudnative-pg
k3s_cnpg_chart_version: 0.28.2
k3s_cnpg_namespace: cnpg-system
k3s_cnpg_release: cnpg
