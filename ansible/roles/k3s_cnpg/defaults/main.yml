---
# defaults file for ansible/roles/k3s_cnpg
k3s_ansible_venv_path: /opt/k3s-ansible-venv
k3s_cnpg_kubeconfig: /etc/rancher/k3s/k3s.yaml

k3s_cnpg_operator_namespace: cnpg-system
k3s_cnpg_release_name: cnpg
k3s_cnpg_chart_repo_name: cnpg
k3s_cnpg_chart_repo_url: https://cloudnative-pg.github.io/charts
k3s_cnpg_chart_ref: cnpg/cloudnative-pg
k3s_cnpg_chart_version: "0.28.0"

k3s_cnpg_cluster_namespace: coin-ops-data
k3s_cnpg_cluster_name: postgres
k3s_cnpg_instances: 1
k3s_cnpg_storage_size: 5Gi

k3s_cnpg_app_secret_name: postgres-app
k3s_cnpg_app_database: "{{ lookup('env', 'POSTGRES_DB') | default('app', true) }}"
k3s_cnpg_app_user: "{{ lookup('env', 'POSTGRES_USER') | default('app', true) }}"
k3s_cnpg_app_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('changeme', true) }}"
