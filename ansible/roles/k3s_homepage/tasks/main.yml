---
# tasks file for ansible/roles/k3s_homepage

- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Python venv support
  # Needed for kubernetes.core.k8s
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present

- name: Install Kubernetes Python client in venv
  ansible.builtin.pip:
    name: "kubernetes=={{ k3s_homepage_python_kubernetes_version }}"
    virtualenv: /opt/headlamp-ansible-venv
    virtualenv_command: python3 -m venv

- name: Create Homepage namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k3s_homepage_namespace }}"
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage service account
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
      secrets:
        - name: homepage
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage SA's token
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/service-account-token
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
        annotations:
          kubernetes.io/service-account.name: homepage
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage ClusterRole
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: homepage
        labels:
          app.kubernetes.io/name: homepage
      rules:
        - apiGroups: [""]
          resources: [namespaces, pods, nodes]
          verbs: [get, list]
        - apiGroups: [extensions, networking.k8s.io]
          resources: [ingresses]
          verbs: [get, list]
        - apiGroups: [traefik.io]
          resources: [ingressroutes]
          verbs: [get, list]
        - apiGroups: [gateway.networking.k8s.io]
          resources: [httproutes, gateways]
          verbs: [get, list]
        - apiGroups: [metrics.k8s.io]
          resources: [nodes, pods]
          verbs: [get, list]
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: homepage
        labels:
          app.kubernetes.io/name: homepage
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: homepage
      subjects:
        - kind: ServiceAccount
          name: homepage
          namespace: "{{ k3s_homepage_namespace }}"
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage ConfigMap
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
      data:
        kubernetes.yaml: |
          mode: cluster
        settings.yaml: |
          title: CoinOps
        custom.css: ""
        custom.js: ""
        docker.yaml: ""
        proxmox.yaml: ""
        bookmarks.yaml: ""
        services.yaml: |
          - Project:
              - coin-ops:
                  href: https://github.com/ua-academy-projects/coin-ops
                  description: Polymarket dashboard source code
                  icon: github
        widgets.yaml: |
          - search:
              provider: duckduckgo
              target: _blank
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage service
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
      spec:
        type: ClusterIP
        ports:
          - port: 3000
            targetPort: http
            protocol: TCP
            name: http
        selector:
          app.kubernetes.io/name: homepage
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage Deployment
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
      spec:
        revisionHistoryLimit: 3
        replicas: 1
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            app.kubernetes.io/name: homepage
        template:
          metadata:
            labels:
              app.kubernetes.io/name: homepage
          spec:
            serviceAccountName: homepage
            automountServiceAccountToken: true
            dnsPolicy: ClusterFirst
            enableServiceLinks: true
            containers:
              - name: homepage
                image: "ghcr.io/gethomepage/homepage:latest"
                imagePullPolicy: Always
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                env:
                  - name: MY_POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: HOMEPAGE_ALLOWED_HOSTS
                    value: "$(MY_POD_IP):3000,{{ k3s_homepage_domain }}"
                ports:
                  - name: http
                    containerPort: 3000
                    protocol: TCP
                livenessProbe:
                  httpGet:
                    path: /api/healthcheck
                    port: http
                  initialDelaySeconds: 5
                  periodSeconds: 15
                volumeMounts:
                  - mountPath: /app/config/custom.js
                    name: homepage-config
                    subPath: custom.js
                  - mountPath: /app/config/custom.css
                    name: homepage-config
                    subPath: custom.css
                  - mountPath: /app/config/bookmarks.yaml
                    name: homepage-config
                    subPath: bookmarks.yaml
                  - mountPath: /app/config/docker.yaml
                    name: homepage-config
                    subPath: docker.yaml
                  - mountPath: /app/config/kubernetes.yaml
                    name: homepage-config
                    subPath: kubernetes.yaml
                  - mountPath: /app/config/services.yaml
                    name: homepage-config
                    subPath: services.yaml
                  - mountPath: /app/config/settings.yaml
                    name: homepage-config
                    subPath: settings.yaml
                  - mountPath: /app/config/widgets.yaml
                    name: homepage-config
                    subPath: widgets.yaml
                  - mountPath: /app/config/proxmox.yaml
                    name: homepage-config
                    subPath: proxmox.yaml
                  - mountPath: /app/config/logs
                    name: logs
            volumes:
              - name: homepage-config
                configMap:
                  name: homepage
              - name: logs
                emptyDir: {}
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage Ingress
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
        annotations:
          gethomepage.dev/description: Dynamically Detected Homepage
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Cluster Management
          gethomepage.dev/icon: homepage.png
          gethomepage.dev/name: Homepage
      spec:
        rules:
          - host: "{{ k3s_homepage_domain }}"
            http:
              paths:
                - path: "/"
                  pathType: Prefix
                  backend:
                    service:
                      name: homepage
                      port:
                        number: 3000
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Restart Homepage deployment
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    kind: Deployment
    name: homepage
    namespace: "{{ k3s_homepage_namespace }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_facts['date_time']['iso8601'] }}"
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python
