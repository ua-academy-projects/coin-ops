---
# tasks file for ansible/roles/k3s_homepage

- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Python venv support 
# Needed for kubernetes.core.k8s
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present

- name: Install Kubernetes Python client in venv
  ansible.builtin.pip:
    name: "kubernetes=={{ k3s_homepage_python_kubernetes_version }}"
    virtualenv: /opt/headlamp-ansible-venv
    virtualenv_command: python3 -m venv

- name: Create Homepage namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k3s_homepage_namespace }}"
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

- name: Create Homepage service account
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}" 
        labels:
          app.kubernetes.io/name: homepage
      secrets:
        - name: homepage
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python

# apiVersion: v1
# kind: Secret
# type: kubernetes.io/service-account-token
# metadata:
#   name: homepage
#   namespace: default
#   labels:
#     app.kubernetes.io/name: homepage
#   annotations:
#     kubernetes.io/service-account.name: homepage

- name: Create Homepage SA's token
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig}}" 
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/service-account-token
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
        annotations:
          kubernetes.io/service-account.name: homepage

- name: Create Homepage ConfigMap
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_homepage_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: homepage
        namespace: "{{ k3s_homepage_namespace }}"
        labels:
          app.kubernetes.io/name: homepage
      data:
        kubernetes.yaml: |
          mode: cluster
        settings.yaml: ""
        custom.css: ""
        custom.js: ""
        docker.yaml: ""
        bookmarks.yaml: |
          - Developer:
              - Github:
                  - abbr: GH
                    href: https://github.com/
        services.yaml: |
          - My First Group:
              - My First Service:
                  href: http://localhost/
                  description: Homepage is awesome
          - My Second Group:
              - My Second Service:
                  href: http://localhost/
                  description: Homepage is the best
          - My Third Group:
              - My Third Service:
                  href: http://localhost/
                  description: Homepage is 😎
        widgets.yaml: |
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: "cluster"
              nodes:
                show: true
                cpu: true
                memory: true
                showLabel: true
          - resources:
              backend: resources
              expanded: true
              cpu: true
              memory: true
              network: default
          - search:
              provider: duckduckgo
              target: _blank
  vars:
    ansible_python_interpreter: /opt/headlamp-ansible-venv/bin/python
