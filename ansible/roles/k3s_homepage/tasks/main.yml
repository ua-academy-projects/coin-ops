---
# Deploy the Homepage dashboard from the jameswynn/homepage Helm chart and
# expose it through Traefik with TLS — the worked example of the "deploy &
# expose" pattern, Helm-flavoured. The dashboard config (settings, services,
# bookmarks, widgets) is rendered into the chart's `config:` values from
# homepage-values.yaml.j2. Native modules only (helm_repository + helm).
# Runs once on the first node; joiners exit.

- name: Skip k3s-homepage (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Add the Homepage Helm repository
  kubernetes.core.helm_repository:
    name: "{{ k3s_homepage_chart_repo_name }}"
    repo_url: "{{ k3s_homepage_chart_repo_url }}"

- name: Install Homepage via Helm (config + ingress/TLS)
  kubernetes.core.helm:
    name: "{{ k3s_homepage_release }}"
    chart_ref: "{{ k3s_homepage_chart_ref }}"
    chart_version: "{{ k3s_homepage_chart_version }}"
    release_namespace: "{{ k3s_homepage_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
    values: "{{ lookup('template', 'homepage-values.yaml.j2') | from_yaml }}"

- name: Report Homepage URL
  ansible.builtin.debug:
    msg:
      - "Homepage exposed at https://{{ k3s_homepage_host }} (cert via {{ cert_manager_cluster_issuer }})."
      - "Reachable once *.{{ k3s_ingress_domain }} resolves to a k3s node IP from your tailnet client."
