---
# k3s-homepage — the Homepage dashboard (gethomepage.dev), installed from the
# jameswynn/homepage Helm chart and exposed through Traefik with TLS. The
# bookmarks/services/widgets config is supplied via the chart's `config:` values
# block (rendered from homepage-values.yaml.j2). Worked example of the
# "deploy & expose" pattern, now Helm-flavoured. Self-contained: every input
# is declared here as a default.

# First-node guard (runs once; joiners exit) + kubeconfig the modules use.
k3s_first_node: "{{ ansible_play_hosts_all[0] }}"
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Helm chart coordinates (jameswynn/homepage wraps the upstream image).
k3s_homepage_chart_repo_name: jameswynn
k3s_homepage_chart_repo_url: https://jameswynn.github.io/helm-charts
k3s_homepage_chart_ref: jameswynn/homepage
k3s_homepage_chart_version: 2.1.0
k3s_homepage_namespace: homepage
k3s_homepage_release: homepage

# Pin the Homepage image tag for reproducible rollouts (empty == chart default).
k3s_homepage_image_tag: ""

# Ingress / TLS — shared with k3s-cert-manager. The host is <name>.<domain>;
# the annotation points Traefik at the cert-manager ClusterIssuer.
k3s_ingress_domain: "{{ coinops_k3s_ingress_domain | default('coinops.pp.ua', true) }}"
cert_manager_cluster_issuer: letsencrypt-cloudflare
k3s_homepage_host: "homepage.{{ k3s_ingress_domain }}"
