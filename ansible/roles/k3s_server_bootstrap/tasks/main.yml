---
# Initializes k3s cluster on the first server node only.
# --tls-san adds public IP to TLS cert so kubectl works from outside.

- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'

- name: Install k3s and initialize cluster (first node only)
  shell: INSTALL_K3S_EXEC="server --cluster-init --tls-san {{ ansible_host }}" /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s API to be ready
  wait_for:
    port: "{{ k3s_api_port }}"
    host: 127.0.0.1
    timeout: 120

- name: Read node join token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Set token and server IP as facts for other plays
  set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
    k3s_server_ip: "{{ ansible_default_ipv4.address }}"