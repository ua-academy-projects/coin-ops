---
# tasks file for k3s_coin_ops
- name: Ensure Coin Ops namespaces exist
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_coin_ops_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels:
          app.kubernetes.io/part-of: coin-ops
  loop:
    - "{{ k3s_coin_ops_namespaces.app }}"
    - "{{ k3s_coin_ops_namespaces.workers }}"
    - "{{ k3s_coin_ops_namespaces.data }}"
