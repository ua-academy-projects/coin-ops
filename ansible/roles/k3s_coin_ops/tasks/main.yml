---
# tasks file for k3s_coin_ops
- name: Ensure Coin Ops namespaces exist
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_coin_ops_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels:
          app.kubernetes.io/part-of: coin-ops
  loop:
    - "{{ k3s_coin_ops_namespaces.app }}"
    - "{{ k3s_coin_ops_namespaces.workers }}"
    - "{{ k3s_coin_ops_namespaces.data }}"

- name: Create GHCR pull secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_coin_ops_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ k3s_coin_ops_pull_secret_name }}"
        namespace: "{{ item }}"
        labels:
          app.kubernetes.io/part-of: coin-ops
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ k3s_coin_ops_docker_config_json }}"
  loop:
    - "{{ k3s_coin_ops_namespaces.app }}"
    - "{{ k3s_coin_ops_namespaces.workers }}"
  no_log: true

- name: Build Helm values file
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ k3s_coin_ops_values_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Copy Coin Ops Helm chart
  ansible.builtin.copy:
    src: "{{ k3s_coin_ops_chart_path }}/"
    dest: "{{ k3s_coin_ops_remote_chart_path }}/"
    owner: root
    group: root
    mode: preserve

- name: Deploy Coin Ops Helm release
  kubernetes.core.helm:
    name: "{{ k3s_coin_ops_release_name }}"
    chart_ref: "{{ k3s_coin_ops_remote_chart_path }}"
    release_namespace: "{{ k3s_coin_ops_namespaces.app }}"
    create_namespace: false
    kubeconfig: "{{ k3s_coin_ops_kubeconfig }}"
    values_files:
      - "{{ k3s_coin_ops_values_file }}"
    wait: true
    timeout: 10m0s
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"
  no_log: true
