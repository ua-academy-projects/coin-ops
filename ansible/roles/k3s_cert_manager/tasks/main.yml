---
# tasks file for ansible/roles/k3s_cert_manager
- name: Add cert-manager Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"

- name: Create cert-manager namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k3s_cert_manager_namespace }}"
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"

  # creates cert-manager-controller, cert-manager-cainjector, cert-manager-webhook
- name: Deploy cert-manager via Helm
  kubernetes.core.helm:
    name: "{{ k3s_cert_manager_release_name }}"
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ k3s_cert_manager_namespace }}"
    chart_version: "{{ k3s_cert_manager_version }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      crds:
        enabled: true
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"

- name: Create Cloudflare API token secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: "{{ k3s_cert_manager_namespace }}"
      stringData:
        api-token: "{{ cloudflare_api_token }}"
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"
  no_log: true

- name: Create ClusterIssuer
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer # clusterissuer -> cluster wide, issuer -> namespace
      metadata:
        name: letsencrypt # ingress referenced to it in annotations
      spec:
        acme:
          # server: https://acme-staging-v02.api.letsencrypt.org/directory
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ k3s_cert_manager_email }}"
          privateKeySecretRef:
            name: letsencrypt-account-key # secret to store lets encrypt key
          solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: cloudflare-api-token
                    key: api-token
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"
