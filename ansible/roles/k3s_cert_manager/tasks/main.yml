---
# Install cert-manager via Helm and wire up a Let's Encrypt DNS-01 ClusterIssuer
# backed by Cloudflare, so any Ingress annotated with
# `cert-manager.io/cluster-issuer: {{ cert_manager_cluster_issuer }}` gets a
# real, browser-trusted certificate — even though this cluster is private and
# unreachable from the public internet (DNS-01 validates over DNS, not HTTP).
#
# Native modules only: kubernetes.core.helm for the chart, kubernetes.core.k8s
# for the Secret + ClusterIssuer. Runs once on the first node; joiners exit.

- name: Skip k3s-cert-manager (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Add the jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: Install cert-manager (with CRDs)
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
    values:
      crds:
        enabled: true

- name: Create the Cloudflare API-token secret for the DNS-01 solver
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: "{{ cert_manager_namespace }}"
      type: Opaque
      stringData:
        api-token: "{{ cloudflare_token }}"
  no_log: true
  when: cloudflare_token | length > 0

# Retried: cert-manager's validating webhook can briefly refuse connections
# right after the Helm release reports ready, which rejects the first apply.
- name: Create the Let's Encrypt DNS-01 ClusterIssuer (Cloudflare)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_kubeconfig }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_cluster_issuer }}"
      spec:
        acme:
          server: "{{ acme_server }}"
          email: "{{ acme_email }}"
          privateKeySecretRef:
            name: "{{ cert_manager_cluster_issuer }}-account-key"
          solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: cloudflare-api-token
                    key: api-token
  register: cert_manager_issuer
  retries: 10
  delay: 6
  until: cert_manager_issuer is not failed
  when: cloudflare_token | length > 0

- name: Report cert-manager / ingress wiring
  ansible.builtin.debug:
    msg:
      - "cert-manager {{ cert_manager_chart_version }} installed; ClusterIssuer '{{ cert_manager_cluster_issuer }}' {{ 'created' if cloudflare_token | length > 0 else 'SKIPPED (no cloudflare_token)' }}."
      - "Expose an app with TLS by adding to its Ingress:"
      - "  annotations: {cert-manager.io/cluster-issuer: {{ cert_manager_cluster_issuer }}}"
      - "  tls: [{hosts: [<app>.{{ k3s_ingress_domain }}], secretName: <app>-tls}]"
      - "Prereq: a wildcard DNS A record *.{{ k3s_ingress_domain }} -> a k3s node private IP, resolvable from your tailnet client."
