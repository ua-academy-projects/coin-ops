---
# defaults file for ansible/roles/k3s_cert_manager
k3s_ansible_venv_path: /opt/k3s-ansible-venv

k3s_cert_manager_namespace: cert-manager
k3s_cert_manager_release_name: cert-manager
# lts version
k3s_cert_manager_version: v1.17.0

# TODO: Move it to the secrets
k3s_cert_manager_email: "{{ lookup('env', 'LETSENCRYPT_EMAIL') }}"
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
