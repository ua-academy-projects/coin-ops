---
# Installs system dependencies required for k3s on all nodes.
# curl — to download k3s installer, open-iscsi/nfs-common — for persistent storage support.

- name: Install k3s prerequisites
  apt:
    name:
      - curl
      - open-iscsi
      - nfs-common
    state: present
    update_cache: yes

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm.sh
    mode: '0755'

- name: Install Helm
  command: /tmp/get-helm.sh
  args:
    creates: /usr/local/bin/helm

- name: Install pip3
  apt:
    name: python3-pip
    state: present

- name: Install Python kubernetes library
  pip:
    name: kubernetes
    state: present
    extra_args: --break-system-packages

- name: Configure Traefik ping endpoint
  # HelmChartConfig patches the k3s built-in Traefik Helm chart.
  # ping.enabled = true adds /ping endpoint on port 8080 (Traefik's internal port).
  # This endpoint returns 200 without needing a Host header — perfect for LB health checks.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          ping:
            enabled: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml