---
# Installs system dependencies required for k3s on all nodes.
# curl — to download k3s installer, open-iscsi/nfs-common — for persistent storage support.

- name: Install k3s prerequisites
  apt:
    name:
      - curl
      - open-iscsi
      - nfs-common
    state: present
    update_cache: yes

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm.sh
    mode: '0755'

- name: Install Helm
  command: /tmp/get-helm.sh
  args:
    creates: /usr/local/bin/helm