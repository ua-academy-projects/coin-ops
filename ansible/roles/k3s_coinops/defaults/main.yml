---
# k3s-coinops — the real Coin-Ops application on k3s: proxy, history-api,
# history-consumer, ui, and an in-cluster gateway nginx that path-routes
# /api -> proxy, /history-api -> history-api, / -> ui (mirrors the proven
# cloud-nginx routing). One Ingress fronts the gateway with TLS.
# Self-contained: config-sourced values read their coinops_* var as a default.

k3s_first_node: "{{ ansible_play_hosts_all[0] }}"
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Helm reads chart files from the local filesystem on whichever host runs the
# task. The chart lives on the controller; the role stages it here on the node
# before `kubernetes.core.helm` runs.
coinops_chart_stage_dir: /opt/coinops/charts

# Per-workload namespaces (one Deployment per namespace). The backing-service
# namespaces are owned by k3s_coinops_data; referenced here only for cross-ns DNS.
coinops_proxy_namespace: coinops-proxy
coinops_history_api_namespace: coinops-history-api
coinops_history_consumer_namespace: coinops-history-consumer
coinops_ui_namespace: coinops-ui
coinops_gateway_namespace: coinops-gateway
coinops_postgres_namespace: coinops-postgres
coinops_rabbitmq_namespace: coinops-rabbitmq
coinops_redis_namespace: coinops-redis

# Namespaces that pull private GHCR images / need app config+secrets.
coinops_app_namespaces:
  - "{{ coinops_proxy_namespace }}"
  - "{{ coinops_history_api_namespace }}"
  - "{{ coinops_history_consumer_namespace }}"
coinops_image_pull_namespaces: "{{ coinops_app_namespaces + [coinops_ui_namespace] }}"

# Ingress / TLS — shared with k3s-cert-manager. Served at app.<domain>.
k3s_ingress_domain: "{{ coinops_k3s_ingress_domain | default('coinops.pp.ua', true) }}"
cert_manager_cluster_issuer: letsencrypt-cloudflare
coinops_app_host: "app.{{ k3s_ingress_domain }}"

# Images — same registry/tag as the compose deployment.
coinops_image_registry: "{{ coinops_image_registry_override | default('ghcr.io/ua-academy-projects', true) }}"
coinops_image_tag: "{{ coinops_image_tag_override | default('dev-latest', true) }}"
coinops_proxy_image: "{{ coinops_image_registry }}/coin-ops-proxy:{{ coinops_image_tag }}"
coinops_history_api_image: "{{ coinops_image_registry }}/coin-ops-history-api:{{ coinops_image_tag }}"
coinops_history_consumer_image: "{{ coinops_image_registry }}/coin-ops-history-consumer:{{ coinops_image_tag }}"
coinops_ui_image: "{{ coinops_image_registry }}/coin-ops-ui:{{ coinops_image_tag }}"
coinops_gateway_image: "nginx:alpine"

coinops_proxy_port: 8080
coinops_history_port: 8000

# Identities/creds (from inventory / cloud-secrets add_host).
coinops_app_db_name: "{{ coinops_db_name | default('cognitor', true) }}"
coinops_app_db_user: "{{ coinops_db_user | default('cognitor', true) }}"
coinops_app_db_password: "{{ coinops_db_password | default('') }}"
coinops_app_rabbitmq_user: "{{ coinops_rabbitmq_user | default('cognitor', true) }}"
coinops_app_rabbitmq_password: "{{ coinops_rabbitmq_password | default('') }}"

# GHCR image-pull auth (private images). Token + username from cloud-secrets.
coinops_image_pull_registry: "{{ coinops_image_registry.split('/')[0] }}"
coinops_image_pull_username: "{{ coinops_ghcr_username | default('', true) }}"
coinops_image_pull_token: "{{ coinops_ghcr_token | default('') }}"

# In-cluster service hostnames + connection URLs (external runtime mode). Each
# backing service lives in its own namespace (coinops-postgres / coinops-rabbitmq
# / coinops-redis), so clients address them cross-namespace as
# <svc>.<namespace>.svc.cluster.local. PostgreSQL is a CloudNativePG Cluster;
# clients use its read-write Service `<cluster>-rw` (the cluster name must match
# coinops_cnpg_cluster_name in k3s_coinops_data).
coinops_cnpg_cluster_name: coinops-pg
coinops_pg_host: "{{ coinops_cnpg_cluster_name }}-rw.{{ coinops_postgres_namespace }}.svc.cluster.local"
coinops_mq_host: "rabbitmq.{{ coinops_rabbitmq_namespace }}.svc.cluster.local"
coinops_redis_host: "redis.{{ coinops_redis_namespace }}.svc.cluster.local"
coinops_app_database_url: "postgresql://{{ coinops_app_db_user }}:{{ coinops_app_db_password }}@{{ coinops_pg_host }}:5432/{{ coinops_app_db_name }}"
coinops_app_rabbitmq_url: "amqp://{{ coinops_app_rabbitmq_user }}:{{ coinops_app_rabbitmq_password }}@{{ coinops_mq_host }}:5672/"
coinops_app_redis_url: "redis://{{ coinops_redis_host }}:6379/0"
coinops_app_cors_origin: "https://{{ coinops_app_host }}"
