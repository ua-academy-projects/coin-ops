---
# k3s_coinops — under GitOps, ArgoCD owns the coinops-app Helm release. This role
# no longer installs the chart. Its sole remaining job is to seed the two Secrets
# the chart references by name but no longer manufactures (GitOps keeps secret
# VALUES out of git): the GHCR image-pull Secret and the app connection-string
# Secret. Native modules only. Runs once on the first node; joiners exit.

- name: Skip k3s_coinops (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

# --- GHCR dockerconfigjson (same assembly as before the GitOps move) ----------
- name: Build the GHCR registry auth entry
  ansible.builtin.set_fact:
    coinops_ghcr_auth:
      username: "{{ coinops_image_pull_username }}"
      password: "{{ coinops_image_pull_token }}"
      auth: "{{ (coinops_image_pull_username ~ ':' ~ coinops_image_pull_token) | b64encode }}"
  no_log: true
  when: coinops_image_pull_token | length > 0

- name: Assemble the dockerconfigjson (registry as the templated key)
  ansible.builtin.set_fact:
    coinops_dockerconfig_b64: "{{ {'auths': {coinops_image_pull_registry: coinops_ghcr_auth}} | to_json | b64encode }}"
  no_log: true
  when: coinops_image_pull_token | length > 0

# --- Ensure the app namespaces exist before seeding Secrets into them ----------
# ArgoCD also manages these namespaces (the chart creates them with the
# coinops-tier=app label). Creating them here first is idempotent; ArgoCD adopts
# them and reconciles the label on sync.
- name: Ensure app namespaces exist
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels:
          coinops-tier: app
  loop:
    - "{{ coinops_proxy_namespace }}"
    - "{{ coinops_history_api_namespace }}"
    - "{{ coinops_history_consumer_namespace }}"
    - "{{ coinops_ui_namespace }}"

# --- Seed the GHCR image-pull Secret into every image-pull namespace -----------
- name: Seed the ghcr-pull image-pull Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-pull
        namespace: "{{ item }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ coinops_dockerconfig_b64 }}"
  loop:
    - "{{ coinops_proxy_namespace }}"
    - "{{ coinops_history_api_namespace }}"
    - "{{ coinops_history_consumer_namespace }}"
    - "{{ coinops_ui_namespace }}"
  no_log: true
  when: coinops_image_pull_token | length > 0

# --- Seed the app connection-string Secret into the three backend namespaces ---
- name: Seed the coinops-app-secrets connection Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k3s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: coinops-app-secrets
        namespace: "{{ item }}"
      type: Opaque
      stringData:
        DATABASE_URL: "{{ coinops_app_database_url }}"
        RABBITMQ_URL: "{{ coinops_app_rabbitmq_url }}"
        REDIS_URL: "{{ coinops_app_redis_url }}"
  loop:
    - "{{ coinops_proxy_namespace }}"
    - "{{ coinops_history_api_namespace }}"
    - "{{ coinops_history_consumer_namespace }}"
  no_log: true

- name: Report secret seeding
  ansible.builtin.debug:
    msg:
      - "Seeded ghcr-pull (4 ns) + coinops-app-secrets (3 ns). ArgoCD owns the rest of coinops-app."
      - "ArgoCD ignores these Secrets (see gitops/apps/coinops-app.yaml ignoreDifferences)."
