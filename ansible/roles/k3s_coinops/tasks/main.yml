---
# ── k3s_coinops: main orchestrator ────────────────────────────────────────
# Deploys full CoinOps stack into k3s cluster.
# Execution order matters — each layer depends on the previous one.
# Uses separate namespaces per concern.
#
# Order:
#   1. namespaces  — create isolation boundaries first
#   2. secrets     — credentials must exist before any pod starts
#   3. queue       — rabbitmq + redis before app services
#   4. app         — backend services + schema init Job
#   5. frontend    — ui last, depends on app layer being ready
#
# Database: CNPG PostgreSQL inside k3s cluster (coinops-db-rw.coinops-app.svc.cluster.local)

- name: Create namespaces
  include_tasks: namespaces.yml

- name: Create secrets
  include_tasks: secrets.yml

- name: Deploy queue layer (rabbitmq + redis)
  include_tasks: queue.yml

- name: Deploy app layer (schema init + history + proxy)
  include_tasks: app.yml

- name: Deploy frontend layer (ui + ingress--)
  include_tasks: frontend.yml
