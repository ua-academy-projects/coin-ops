---
# k3s_coinops — deploy the Coin-Ops app via the coinops-app Helm chart.
# Backing services (CNPG / rabbitmq / redis) and the data-tier NetworkPolicies
# remain in their own roles. Native modules only. Runs once on the first node.

- name: Skip k3s_coinops (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

# Assemble the GHCR dockerconfigjson (same shape as before — the chart materialises
# the per-namespace Secrets from this base64 value).
- name: Build the GHCR registry auth entry
  ansible.builtin.set_fact:
    coinops_ghcr_auth:
      username: "{{ coinops_image_pull_username }}"
      password: "{{ coinops_image_pull_token }}"
      auth: "{{ (coinops_image_pull_username ~ ':' ~ coinops_image_pull_token) | b64encode }}"
  no_log: true
  when: coinops_image_pull_token | length > 0

- name: Assemble the dockerconfigjson (registry as the templated key)
  ansible.builtin.set_fact:
    coinops_dockerconfig_b64: "{{ {'auths': {coinops_image_pull_registry: coinops_ghcr_auth}} | to_json | b64encode }}"
  no_log: true
  when: coinops_image_pull_token | length > 0

# kubernetes.core.helm invokes `helm` on the target node, which reads the chart
# from the local filesystem there. The chart files live on the controller
# (under {{ playbook_dir }}/../charts), so stage them on the node first.
- name: Ensure chart staging directory exists on the node
  ansible.builtin.file:
    path: "{{ coinops_chart_stage_dir }}"
    state: directory
    mode: '0755'

- name: Copy the coinops-app chart to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../charts/coinops-app/"
    dest: "{{ coinops_chart_stage_dir }}/coinops-app/"
    mode: '0644'
    directory_mode: '0755'

- name: Deploy the coinops-app Helm chart
  kubernetes.core.helm:
    name: coinops-app
    chart_ref: "{{ coinops_chart_stage_dir }}/coinops-app"
    release_namespace: "{{ coinops_gateway_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
    wait_timeout: 5m
    atomic: true
    values:
      image:
        registry: "{{ coinops_image_registry }}"
        tag: "{{ coinops_image_tag }}"
        pullSecretDockerconfigjson: "{{ coinops_dockerconfig_b64 | default('') }}"
      ingress:
        host: "{{ coinops_app_host }}"
        className: traefik
        tlsSecretName: coinops-app-tls
        certManagerClusterIssuer: "{{ cert_manager_cluster_issuer }}"
      proxy:
        namespace: "{{ coinops_proxy_namespace }}"
        image: coin-ops-proxy
        port: "{{ coinops_proxy_port }}"
        replicas: 1
      historyApi:
        namespace: "{{ coinops_history_api_namespace }}"
        image: coin-ops-history-api
        port: "{{ coinops_history_port }}"
        replicas: 1
      historyConsumer:
        namespace: "{{ coinops_history_consumer_namespace }}"
        image: coin-ops-history-consumer
        replicas: 1
      ui:
        namespace: "{{ coinops_ui_namespace }}"
        image: coin-ops-ui
        replicas: 1
      gateway:
        namespace: "{{ coinops_gateway_namespace }}"
        image: nginx:alpine
        replicas: 1
      app:
        databaseUrl: "{{ coinops_app_database_url }}"
        rabbitmqUrl: "{{ coinops_app_rabbitmq_url }}"
        redisUrl: "{{ coinops_app_redis_url }}"
      backingNamespaces:
        postgres: "{{ coinops_postgres_namespace }}"
        rabbitmq: "{{ coinops_rabbitmq_namespace }}"
        redis: "{{ coinops_redis_namespace }}"
      networkPolicy:
        enabled: true
        podCidr: 10.42.0.0/16
        serviceCidr: 10.43.0.0/16
  no_log: true

- name: Report deployed release
  ansible.builtin.debug:
    msg:
      - "coinops-app Helm release deployed to {{ coinops_gateway_namespace }}."
      - "App served at https://{{ coinops_app_host }} (cert via {{ cert_manager_cluster_issuer }})."
      - "History/rollback: helm history coinops-app -n {{ coinops_gateway_namespace }} | helm rollback coinops-app <rev> -n {{ coinops_gateway_namespace }}"
