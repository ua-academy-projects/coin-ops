---
# ── secrets.yml ────────────────────────────────────────────────────────────
# Creates two categories of Secrets:
# 1. imagePullSecret (docker-registry type) — allows nodes to pull private
#    images from GHCR. Must exist in every namespace that runs pods.
# 2. App secrets (Opaque type) — passwords injected as env vars into pods.
#
# Secrets are namespace-scoped — each namespace gets its own copy.
# Values come from environment variables via lookup('env') — never hardcoded.

# ── Part 1: imagePullSecret in all 3 namespaces ───────────────────────────
# Without this, every pod fails with ImagePullBackOff because GHCR is private.
# docker-registry type = special Secret format Kubernetes uses for registry auth.

- name: Create GHCR imagePullSecret in all coinops namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-pull-secret
        namespace: "{{ item }}"
      # docker-registry = special Kubernetes Secret type for image registry auth
      type: kubernetes.io/dockerconfigjson
      data:
        # .dockerconfigjson = the key Kubernetes looks for in this Secret type.
        # Value = base64-encoded JSON with registry URL, username, and token.
        # This is exactly what 'docker login' stores in ~/.docker/config.json.
        .dockerconfigjson: "{{ {
          'auths': {
            'ghcr.io': {
              'username': lookup('env', 'GHCR_USERNAME'),
              'password': lookup('env', 'GHCR_TOKEN'),
              'auth': (lookup('env', 'GHCR_USERNAME') + ':' + lookup('env', 'GHCR_TOKEN')) | b64encode
            }
          }
        } | to_json | b64encode }}"
  loop:
    - "{{ coinops_ns_queue }}"
    - "{{ coinops_ns_app }}"
    - "{{ coinops_ns_frontend }}"

# ── Part 2: Queue layer secrets (coinops-queue) ───────────────────────────
# RabbitMQ needs its own credentials to start.
# redis needs no password in our setup.

- name: Create queue layer secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: coinops-queue-secret
        namespace: "{{ coinops_ns_queue }}"
      # Opaque = general purpose Secret type for arbitrary key-value data
      type: Opaque
      data:
        # Each value must be base64-encoded — Kubernetes API requirement
        RABBITMQ_DEFAULT_USER: "{{ coinops_rabbitmq_user | b64encode }}"
        RABBITMQ_DEFAULT_PASS: "{{ lookup('env', 'RABBITMQ_PASSWORD') | b64encode }}"

# ── Part 3: App layer secrets (coinops-app) ───────────────────────────────
# proxy and history services need DB + RabbitMQ connection strings.
# DATABASE_URL uses CloudSQL private IP read from Terraform output in main.yml.

- name: Create app layer secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: coinops-app-secret
        namespace: "{{ coinops_ns_app }}"
      type: Opaque
      data:
        # DATABASE_URL — points to CloudSQL private IP (not a pod, not localhost)
        # Format: postgresql://user:password@host:port/dbname
        DATABASE_URL: "{{ ('postgresql://' + db_user + ':' + lookup('env', 'DB_PASSWORD') + '@' + cloudsql_ip + ':5432/' + db_name) | b64encode }}"
        # RABBITMQ_URL — points to rabbitmq Service in coinops-queue namespace
        # Full DNS: service.namespace.svc.cluster.local
        RABBITMQ_URL: "{{ ('amqp://' + coinops_rabbitmq_user + ':' + lookup('env', 'RABBITMQ_PASSWORD') + '@rabbitmq.' + coinops_ns_queue + '.svc.cluster.local:5672/') | b64encode }}"
        RABBITMQ_DEFAULT_USER: "{{ coinops_rabbitmq_user | b64encode }}"
        RABBITMQ_DEFAULT_PASS: "{{ lookup('env', 'RABBITMQ_PASSWORD') | b64encode }}"
        POSTGRES_USER: "{{ db_user | b64encode }}"
        POSTGRES_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') | b64encode }}"
        POSTGRES_DB: "{{ db_name | b64encode }}"
        RUNTIME_BACKEND: "{{ runtime_backend | b64encode }}"
        REDIS_URL: "{{ ('redis://redis.' + coinops_ns_queue + '.svc.cluster.local:6379/0') | b64encode }}"
        PORT_PROXY: "{{ coinops_proxy_port | b64encode }}"
        PORT_HISTORY: "{{ coinops_history_port | b64encode }}"