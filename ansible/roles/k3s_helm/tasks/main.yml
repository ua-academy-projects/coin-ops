---
# tasks file for ansible/roles/k3s_helm
- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Python venv support 
# Needed for kubernetes.core.k8s
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present

- name: Install Kubernetes Python client in venv
  ansible.builtin.pip:
    name: "kubernetes=={{ helm_python_kubernetes_version }}"
    virtualenv: "{{ k3s_ansible_venv_path }}"
    virtualenv_command: python3 -m venv

- name: Add Headlamp Helm repo
  kubernetes.core.helm_repository:
    name: headlamp
    repo_url: https://kubernetes-sigs.github.io/headlamp/
  vars:
    ansible_python_interpreter: "{{ k3s_ansible_venv_path }}/bin/python"
