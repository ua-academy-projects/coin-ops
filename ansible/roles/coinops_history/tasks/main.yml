---
- name: Ensure CoinOps history namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ coinops_history_namespace }}"

- name: Apply CoinOps history API deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', role_path ~ '/templates/api-deployment.yml.j2') | from_yaml }}"

- name: Apply CoinOps history API service
  kubernetes.core.k8s:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', role_path ~ '/templates/api-service.yml.j2') | from_yaml }}"

- name: Apply CoinOps history consumer deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', role_path ~ '/templates/consumer-deployment.yml.j2') | from_yaml }}"

- name: Wait for CoinOps history API rollout
  kubernetes.core.k8s_info:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ coinops_history_namespace }}"
    name: "{{ coinops_history_api_app_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Wait for CoinOps history consumer rollout
  kubernetes.core.k8s_info:
    kubeconfig: "{{ coinops_history_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ coinops_history_namespace }}"
    name: "{{ coinops_history_consumer_app_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
