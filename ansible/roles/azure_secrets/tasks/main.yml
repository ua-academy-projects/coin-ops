---
- name: Validate Azure Key Vault name is set for secret fetch
  assert:
    that:
      - azure_key_vault_name | length > 0
    fail_msg: "AZ_KEYVAULT_NAME must be exported to fetch secrets from Azure Key Vault."
  when:
    - required_secrets | default([]) | length > 0

- name: Request Azure IMDS access token for Key Vault
  uri:
    url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net"
    method: GET
    headers:
      Metadata: "true"
    return_content: true
  register: azure_imds_token
  changed_when: false
  no_log: true
  when:
    - required_secrets | default([]) | length > 0

- name: Read secrets from Azure Key Vault
  uri:
    url: "https://{{ azure_key_vault_name }}.vault.azure.net/secrets/{{ gsm_secret_ids[item] }}?api-version=7.4"
    method: GET
    headers:
      Authorization: "Bearer {{ azure_imds_token.json.access_token }}"
    return_content: true
  loop: "{{ required_secrets | default([]) }}"
  register: azure_secret_reads
  changed_when: false
  no_log: true
  when:
    - required_secrets | default([]) | length > 0

- name: Store fetched Azure secrets as host facts
  set_fact:
    fetched_gsm_secrets: >-
      {{
        fetched_gsm_secrets | default({}) |
        combine({ item.item: item.json.value })
      }}
  loop: "{{ azure_secret_reads.results | default([]) }}"
  no_log: true
  when:
    - required_secrets | default([]) | length > 0
