---
# Deploy the hello-world learning workload with the native kubernetes.core
# module — no `k3s kubectl` shell. Runs once on the first node; joiners exit.
# The template renders Namespace + Deployment + ClusterIP Service + Ingress(TLS);
# we split the documents and apply each in order. `wait: true` blocks until the
# Deployment is Available, which replaces the old explicit rollout-status task.

- name: Skip k3s-hello (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Apply hello-world manifests
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
  loop: "{{ lookup('template', 'k3s-hello.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
