---
# =============================================================================
# roles/squid/tasks/main.yml
# =============================================================================

- name: Install Squid
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: true

- name: Copy allowed domains list
  ansible.builtin.template:
    src: allowed_domains.txt.j2
    dest: /etc/squid/allowed_domains.txt
    owner: root
    group: root
    mode: '0644'
  notify: restart squid

- name: Configure Squid
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart squid

- name: Ensure Squid is enabled and started
  ansible.builtin.service:
    name: squid
    state: started
    enabled: true
