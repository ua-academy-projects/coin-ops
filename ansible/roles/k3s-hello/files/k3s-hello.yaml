---
# Sample learning workload for the k3s POC: nginxdemos/hello.
# 2 replicas + NodePort :30080 (matches the firewall rule
# k3s_nodeport_from_tailnet in the GCP security module).
apiVersion: v1
kind: Namespace
metadata:
  name: coinops-hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: coinops-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: coinops-hello
spec:
  type: NodePort
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
