---
# Deploy the hello-world learning workload. Runs once on the first node
# of the k3s group; the manifest lands in the cluster via `k3s kubectl
# apply` and the result is reachable on :30080 on any node.

- name: Skip k3s-hello (not the first node)
  meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Stage hello manifest on first node
  copy:
    src: k3s-hello.yaml
    dest: /opt/k3s/k3s-hello.yaml
    owner: root
    group: root
    mode: '0644'

- name: Apply hello manifest
  command: /usr/local/bin/k3s kubectl apply -f /opt/k3s/k3s-hello.yaml
  register: k3s_hello_apply
  changed_when: "'created' in k3s_hello_apply.stdout or 'configured' in k3s_hello_apply.stdout"

- name: Wait for hello deployment rollout
  command: /usr/local/bin/k3s kubectl -n coinops-hello rollout status deployment/hello --timeout=120s
  changed_when: false
