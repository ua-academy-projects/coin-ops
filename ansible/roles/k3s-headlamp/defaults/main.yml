---
# Headlamp container image. Defaults to the upstream :latest; pin a tag
# (e.g. ghcr.io/headlamp-k8s/headlamp:v0.30.0) for reproducible rollouts.
k3s_headlamp_image: "ghcr.io/headlamp-k8s/headlamp:latest"

# kubeconfig the kubernetes.core modules use on the first node.
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# First-node guard — mirrors roles/k3s so this role stands alone.
k3s_first_node: "{{ ansible_play_hosts_all[0] }}"

# Ingress / TLS — shared with k3s-cert-manager. Exposed at headlamp.<domain>.
k3s_ingress_domain: "lab.coinops.pp.ua"
cert_manager_cluster_issuer: letsencrypt-cloudflare
headlamp_host: "headlamp.{{ k3s_ingress_domain }}"
