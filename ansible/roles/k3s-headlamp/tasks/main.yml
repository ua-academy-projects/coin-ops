---
# Deploy the Headlamp dashboard with the native kubernetes.core module — no
# `k3s kubectl` shell. Runs once on the first node; joiners exit. The manifest
# is a Jinja template (image + NodePort are variables); we render it on the
# controller, split the documents, and apply each. `wait: true` blocks until
# the Deployment is Available.

- name: Skip k3s-headlamp (not the first node)
  ansible.builtin.meta: end_host
  when: inventory_hostname != k3s_first_node

- name: Apply Headlamp manifests
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    kubeconfig: "{{ k3s_kubeconfig }}"
    wait: true
  loop: "{{ lookup('template', 'k3s-headlamp.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Show how to reach Headlamp and mint a login token
  ansible.builtin.debug:
    msg:
      - "Headlamp is up at https://{{ headlamp_host }} (cert via {{ cert_manager_cluster_issuer }})."
      - "Reachable once *.{{ k3s_ingress_domain }} resolves to a k3s node IP from your tailnet client."
      - "Mint a 24h login token with:"
      - "  kubectl --kubeconfig=~/.kube/coinops-k3s.yaml -n headlamp create token headlamp-admin --duration=24h"
