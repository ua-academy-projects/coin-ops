---
# defaults file for /tmp/role_skeleton
ui_image_registry: "{{ deploy_config_deploy.image_registry | default('ghcr.io/ua-academy-projects') }}"
ui_image_tag: "{{ deploy_config_deploy.image_tag | default('shabat-latest') }}"
ui_image: "{{ ui_image_registry }}/coin-ops-ui:{{ ui_image_tag }}"
ui_proxy_upstream_port: 8080
ui_history_upstream_port: 8000

# Browser-facing domain served by the UI gateway.
ui_app_domain: "{{ deploy_config_deploy.app_domain | default('coinops.test') }}"

# Supported modes:
#   selfsigned - Ansible creates a local self-signed cert on the UI node
#   provided   - cert/key already exist on the UI node under /etc/cognitor/tls
#   letsencrypt - Ansible obtains/renews a Let's Encrypt cert on the UI node
#   off        - HTTP only, useful for quick internal debugging
ui_tls_mode: "{{ deploy_config_deploy.tls_mode | default('selfsigned') }}"
ui_tls_enabled: "{{ ui_tls_mode != 'off' }}"
ui_tls_cert_dir: /etc/cognitor/tls
ui_tls_cert_path: "{{ ui_tls_cert_dir }}/coinops.crt"
ui_tls_key_path: "{{ ui_tls_cert_dir }}/coinops.key"
ui_tls_acme_webroot: /var/lib/letsencrypt
ui_tls_letsencrypt_email: "{{ deploy_config_deploy.letsencrypt_email | default('') }}"
