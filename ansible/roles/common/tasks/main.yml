---
# =============================================================================
# roles/common/tasks/main.yml
# =============================================================================
# Base OS hardening applied to every node: packages, timezone, NTP, UFW.
# =============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages (safe)
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - htop
      - jq
      - acl
      - unattended-upgrades
      - systemd-timesyncd
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Ensure systemd-timesyncd is running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  ignore_errors: true

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default — deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  notify: Reload UFW

- name: Set UFW default — allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  notify: Reload UFW

- name: Allow configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_allowed_ports }}"
  notify: Reload UFW

- name: Enable UFW
  community.general.ufw:
    state: enabled
