---
# defaults file for /tmp/role_skeleton
proxy_db_name: cognitor
proxy_db_user: cognitor
proxy_db_password: "{{ fetched_gsm_secrets.db_password | default(lookup('env', 'DB_PASSWORD'), true) }}"
proxy_runtime_backend: "{{ runtime_backend | default('external') }}"
proxy_rabbitmq_user: cognitor
proxy_rabbitmq_password: "{{ fetched_gsm_secrets.rabbitmq_password | default(lookup('env', 'RABBITMQ_PASSWORD'), true) }}"
proxy_rabbitmq_url: "amqp://{{ proxy_rabbitmq_user }}:{{ proxy_rabbitmq_password }}@{{ hostvars[groups['history'][0]].private_ip }}:5672/"
proxy_redis_url: "redis://redis:6379/0"
proxy_external_db_host: "{{ deploy_config_deploy.external_db_host | default('') }}"
proxy_database_host: "{{ proxy_external_db_host if proxy_external_db_host | length > 0 else hostvars[groups['history'][0]].private_ip }}"
proxy_database_url: "postgresql://{{ proxy_db_user }}:{{ proxy_db_password }}@{{ proxy_database_host }}:5432/{{ proxy_db_name }}"
proxy_port: 8080
proxy_image_registry: "{{ deploy_config_deploy.image_registry | default('ghcr.io/ua-academy-projects') }}"
proxy_image_tag: "{{ deploy_config_deploy.image_tag | default('shabat-latest') }}"
proxy_image: "{{ proxy_image_registry }}/coin-ops-proxy:{{ proxy_image_tag }}"
