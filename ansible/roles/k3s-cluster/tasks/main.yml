---
# Meta-role: bring up the HA k3s learning cluster on GCP and deploy the
# hello-world workload. Applied to `hosts: k3s` by k3s-up.yml.
#
# common installs base packages, then k3s itself, then the hello workload
# on the first node. The k3s nodes run no Tailscale — operator access
# arrives over the tailnet through the GCP bastion's advertised route
# (the bastion is set up separately by cloud-bastion-stack in k3s-up.yml).

- import_role:
    name: common

# k3s nodes are private and do NOT run Tailscale — kubectl reaches them on
# their private IPs through the GCP bastion's advertised tailnet route.
# Only cloud-bastion-stack joins the tailnet.

- import_role:
    name: k3s

- import_role:
    name: k3s-hello

- import_role:
    name: k3s-headlamp
