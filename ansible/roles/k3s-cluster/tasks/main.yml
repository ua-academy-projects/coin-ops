---
# Meta-role: bring up the HA k3s learning cluster on GCP and deploy the
# hello-world workload. Applied to `hosts: k3s` by k3s-up.yml.
#
# common installs base packages, then k3s itself, then the operator toolchain
# and the workloads on the first node. The k3s nodes run no Tailscale —
# operator access arrives over the tailnet through the GCP bastion's
# advertised route (the bastion is set up separately by cloud-bastion-stack
# in k3s-up.yml).

- name: Base OS packages and hardening (common)
  ansible.builtin.import_role:
    name: common

# k3s nodes are private and do NOT run Tailscale — kubectl reaches them on
# their private IPs through the GCP bastion's advertised tailnet route.
# Only cloud-bastion-stack joins the tailnet.

- name: Install the HA k3s cluster
  ansible.builtin.import_role:
    name: k3s

# Operator toolchain (helm + the Python kubernetes client) on the first node,
# so the workload roles below manage manifests via kubernetes.core.* instead
# of shelling out to `k3s kubectl`. No-op on joiner nodes.
- name: Install cluster-management toolchain (helm + kubernetes client)
  ansible.builtin.import_role:
    name: k3s-tools

# Ingress TLS foundation: cert-manager + a Let's Encrypt DNS-01 ClusterIssuer
# (Cloudflare). Apps below expose themselves through Traefik with real certs.
- name: Install cert-manager and the Let's Encrypt DNS-01 issuer
  ansible.builtin.import_role:
    name: k3s-cert-manager

- name: Deploy the hello-world learning workload
  ansible.builtin.import_role:
    name: k3s-hello

- name: Deploy the Headlamp dashboard
  ansible.builtin.import_role:
    name: k3s-headlamp

# Worked example of the deploy-and-expose pattern: a self-contained role that
# stands up an app (Homepage) and publishes it through the ingress with TLS.
- name: Deploy the Homepage dashboard (deploy-and-expose example)
  ansible.builtin.import_role:
    name: k3s-homepage
