---
# Tailscale auth key — flowed in by [[cloud-secrets]] as coinops_tailscale_auth_key
# (add_host), with an env fallback for local runs. Empty -> the role is a no-op
# so the stack still deploys without Tailscale configured.
tailscale_auth_key: "{{ coinops_tailscale_auth_key | default(lookup('env', 'TAILSCALE_AUTH_KEY') | default('', true), true) }}"

# Hostname registered in the tailnet. Defaults to the inventory name so
# `tailscale status` and MagicDNS map back to Ansible's view of the host.
tailscale_hostname: "{{ inventory_hostname }}"

# Tag declared on `tailscale up`. ACL in tailscale/acl.json grants
# tag:coinops-lab full intra-tag reachability and nothing else.
tailscale_tags:
  - "tag:coinops-lab"

# Subnet routes this host advertises. Derived from coinops_bastion_advertise_routes
# (set only in the [bastion:vars] inventory block by terraform), so the bastion
# advertises its cloud's private subnets and every other host advertises nothing.
tailscale_advertise_routes: "{{ (coinops_bastion_advertise_routes | default('', true)).split(',') | reject('equalto', '') | list }}"
# Accept routes advertised by other tailnet members. Safe default on; turn
# off only on bastions that should not see foreign subnets.
tailscale_accept_routes: true

# Enable `tailscale ssh` for keyless ops access from other tailnet peers.
tailscale_ssh: true

# Pin a specific Tailscale package version. `latest` follows the stable
# channel; pin a SemVer (e.g. "1.78.1") for reproducibility.
tailscale_pkg_version: latest

# Extra flags appended verbatim to `tailscale up`. Useful for advertising
# exit nodes or temporary debugging flags without touching this role.
tailscale_extra_args: ""
