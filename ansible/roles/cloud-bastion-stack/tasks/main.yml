---
# Meta-role: provision the cloud bastion host (jumphost + tailnet ingress).
# Applied to `hosts: bastion` by cloud-deploy.yml. No docker/registry/app
# deploy here — the bastion is intentionally minimal.

- ansible.builtin.import_role:
    name: common

# Join the bastion into the coinops-lab tailnet. The bastion is the
# subnet router: the tailscale role's `tailscale_advertise_routes` default
# reads `coinops_bastion_advertise_routes` (emitted by terraform into the
# bastion's inventory vars), so it advertises its cloud's private subnets.
- ansible.builtin.import_role:
    name: tailscale
