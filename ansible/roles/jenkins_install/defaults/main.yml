---
platform_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"

jenkins_release_name: jenkins
jenkins_namespace: cicd
jenkins_chart_repo_url: https://charts.jenkins.io
jenkins_chart_ref: jenkins/jenkins
jenkins_chart_version: "5.8.42"

jenkins_admin_user: admin

jenkins_domain: jenkins.kazachuk-k3s.pp.ua
jenkins_tls_secret_name: jenkins-tls
jenkins_tls_cluster_issuer: letsencrypt-cloudflare-production

# AKS Standard SSD by default. Bump if you want Premium.
jenkins_storage_class: default
jenkins_storage_size: 8Gi

# Resource footprint tuned for the single B2s_v2 node (8 GB RAM total).
# Java max heap is set via JAVA_OPTS to avoid Jenkins eating the box.
jenkins_resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
jenkins_java_opts: "-Xms256m -Xmx768m"

jenkins_wait: true
jenkins_wait_timeout: 900s

# Name of the pre-created Kubernetes Secret (in the cicd namespace) holding the
# GitHub username + PAT. JCasC reads it via injected env vars, so the token is
# never written into Helm values or git.
jenkins_github_secret_name: jenkins-github-creds

# Git coordinates of the repo Jenkins builds from.
jenkins_repo_url: https://github.com/ua-academy-projects/coin-ops.git
jenkins_repo_branch: feat/azure-aks-platform

# Helm values for jenkins/jenkins chart.
jenkins_values:
  controller:
    image:
      tag: "2.504.3-jdk17"
    admin:
      username: "{{ jenkins_admin_user }}"
    resources: "{{ jenkins_resources }}"
    javaOpts: "{{ jenkins_java_opts }}"
    serviceType: ClusterIP
    installPlugins:
      - kubernetes
      - workflow-aggregator
      - git
      - github
      - configuration-as-code
      - github-branch-source
      - credentials-binding
      - pipeline-stage-view
      - job-dsl
      - ansicolor
      - timestamper
    # Inject the GitHub credential secret as environment variables so JCasC can
    # reference them as ${GITHUB_USERNAME} / ${GITHUB_TOKEN} without hardcoding.
    containerEnv:
      - name: GITHUB_USERNAME
        valueFrom:
          secretKeyRef:
            name: "{{ jenkins_github_secret_name }}"
            key: username
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: "{{ jenkins_github_secret_name }}"
            key: token
    # Jenkins Configuration as Code: declares the whole Jenkins config in YAML,
    # re-applied on every startup. No manual UI clicking; survives restarts.
    JCasC:
      defaultConfig: true
      configScripts:
        welcome-message: |
          jenkins:
            systemMessage: "CoinOps CI/CD - configured entirely via JCasC (no manual setup)."
        github-credentials: |
          credentials:
            system:
              domainCredentials:
                - credentials:
                    - usernamePassword:
                        scope: GLOBAL
                        id: "github-pat"
                        description: "GitHub PAT for repo checkout + GHCR push"
                        username: "${GITHUB_USERNAME}"
                        password: "${GITHUB_TOKEN}"
        seed-coinops-pipeline: |
          jobs:
            - script: >
                pipelineJob('coinops-deploy') {
                  description('Build coinops images with kaniko and deploy to AKS. Managed by JCasC.')
                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('{{ jenkins_repo_url }}')
                            credentials('github-pat')
                          }
                          branch('*/{{ jenkins_repo_branch }}')
                        }
                      }
                      scriptPath('Jenkinsfile')
                      lightweight(true)
                    }
                  }
                  triggers {
                    githubPush()
                  }
                }
    ingress:
      enabled: true
      apiVersion: networking.k8s.io/v1
      ingressClassName: traefik
      hostName: "{{ jenkins_domain }}"
      tls:
        - hosts:
            - "{{ jenkins_domain }}"
          secretName: "{{ jenkins_tls_secret_name }}"
      annotations:
        cert-manager.io/cluster-issuer: "{{ jenkins_tls_cluster_issuer }}"
  agent:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  persistence:
    enabled: true
    storageClass: "{{ jenkins_storage_class }}"
    size: "{{ jenkins_storage_size }}"
  serviceAccount:
    create: true
