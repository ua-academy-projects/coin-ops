---
- name: Persist IPv4 forwarding configuration
  ansible.builtin.copy:
    content: |
      net.ipv4.ip_forward=1
    dest: /etc/sysctl.d/99-coinops-nat.conf
    owner: root
    group: root
    mode: '0644'
  register: nat_sysctl_config

- name: Apply IPv4 forwarding configuration
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-coinops-nat.conf
  when: nat_sysctl_config.changed
  changed_when: true

- name: Enable IPv4 forwarding immediately
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
  changed_when: false

- name: Enable UFW forward policy
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: Reload UFW

- name: Deploy UFW before.rules with NAT masquerade
  ansible.builtin.template:
    src: before.rules.j2
    dest: /etc/ufw/before.rules
    owner: root
    group: root
    mode: '0640'
  notify: Reload UFW
