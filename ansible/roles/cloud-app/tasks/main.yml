---
- name: Create config directory
  file:
    path: /etc/cognitor
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create deploy directory
  file:
    path: /opt/cognitor/cloud-app
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write app environment file
  template:
    src: cloud-app.env.j2
    dest: /etc/cognitor/cloud-app.env
    owner: root
    group: root
    mode: '0640'

- name: Render cloud nginx config
  template:
    src: cloud-nginx.conf.j2
    dest: /opt/cognitor/cloud-app/nginx.conf
    owner: root
    group: root
    mode: '0644'

- name: Render app/backend compose file
  template:
    src: "{{ 'cloud-backend.compose.yaml.j2' if ('ui' in groups and (groups['ui'] | length > 0)) else 'cloud-app.compose.yaml.j2' }}"
    dest: /opt/cognitor/cloud-app/compose.yaml
    owner: root
    group: root
    mode: '0644'

- name: Validate app compose config
  command: docker compose -f /opt/cognitor/cloud-app/compose.yaml config -q
  args:
    chdir: /opt/cognitor/cloud-app
  changed_when: false

- name: Pull app images
  command: docker compose -f /opt/cognitor/cloud-app/compose.yaml pull
  args:
    chdir: /opt/cognitor/cloud-app

- name: Run app compose
  command: docker compose -f /opt/cognitor/cloud-app/compose.yaml up -d --remove-orphans
  args:
    chdir: /opt/cognitor/cloud-app

- name: Wait for local backend gateway health endpoint
  block:
    - name: Poll backend gateway health endpoint
      uri:
        url: http://localhost/health
        method: GET
        status_code: 200
      retries: 12
      delay: 5
      register: backend_gateway_health
      until: backend_gateway_health.status == 200
  rescue:
    - name: Capture backend compose status after failed health check
      command: docker compose -f /opt/cognitor/cloud-app/compose.yaml ps
      args:
        chdir: /opt/cognitor/cloud-app
      register: backend_compose_ps
      changed_when: false
      failed_when: false

    - name: Capture backend compose logs after failed health check
      command: docker compose -f /opt/cognitor/cloud-app/compose.yaml logs --tail 120
      args:
        chdir: /opt/cognitor/cloud-app
      register: backend_compose_logs
      changed_when: false
      failed_when: false

    - name: Show backend compose status
      debug:
        var: backend_compose_ps.stdout_lines

    - name: Show backend compose logs
      debug:
        var: backend_compose_logs.stdout_lines

    - name: Fail after backend gateway health check diagnostics
      fail:
        msg: Backend gateway did not return HTTP 200 on http://localhost/health.
