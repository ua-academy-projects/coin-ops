---
# deploy.yml — deploy all services.
# Safe to re-run on every code push.
#
#   source .env
#   ansible-playbook ansible/deploy.yml

- name: Validate required environment variables
  hosts: localhost
  connection: local
  tasks:
    - name: Check required variables are set
      assert:
        that:
          - (rabbitmq_password | default('') | length > 0)
          - (db_password | default('') | length > 0)
          - (ansible_ssh_private_key_file | length > 0)
          - (runtime_backend | default('external')) in ['external', 'postgres']
        fail_msg: |
          Required secrets could not be resolved. 
          If using Cloud DB, ensure 'cloud_provider' is set in inventory.
          Otherwise, ensure RABBITMQ_PASSWORD and DB_PASSWORD are set in .env.

- name: Authenticate Docker registry on target nodes
  hosts: all:!localhost
  become: yes
  tasks:
    - name: Log in to configured container registry
      community.docker.docker_login:
        registry_url: "{{ image_registry_host }}"
        username: "{{ registry_username }}"
        password: "{{ registry_token }}"
        reauthorize: true
      no_log: true
      when:
        - registry_username | length > 0
        - registry_token | length > 0

    - name: Explain skipped registry login
      debug:
        msg: "GHCR_USERNAME/GHCR_TOKEN not set; assuming registry images are public."
      when: registry_username | length == 0 or registry_token | length == 0

- name: Deploy History Service (node-01)
  hosts: history
  become: yes
  roles:
    - history

- name: Deploy Proxy Service (node-02)
  hosts: proxy
  become: yes
  roles:
    - proxy

- name: Deploy Web UI (node-03)
  hosts: ui
  become: yes
  roles:
    - ui
