---
# deploy.yml — provision + deploy all VM-mode services.
# Idempotent. Safe to re-run on every code push.
#
#   source .env
#   ansible-playbook -i ansible/inventory ansible/deploy.yml

- name: Validate required environment variables
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check .env vars are exported
      assert:
        that:
          - lookup('env', 'RABBITMQ_PASSWORD') != ''
          - lookup('env', 'DB_PASSWORD') != ''
          - lookup('env', 'SSH_KEY_PATH') != ''
          - lookup('env', 'RUNTIME_BACKEND') in ['', 'external', 'postgres']
        fail_msg: |
          Required environment variables are not set or RUNTIME_BACKEND is invalid.
          Run:  source .env
          RUNTIME_BACKEND may be empty and will default to external.
          Supported explicit runtime backends: external, postgres.

- hosts: history
  become: yes
  roles: [vm-history-stack]

- hosts: proxy
  become: yes
  roles: [vm-proxy-stack]

- hosts: ui
  become: yes
  roles: [vm-ui-stack]
