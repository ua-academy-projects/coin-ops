---
# k3s group defaults. The role's defaults/main.yml is also active; this
# file is where you tune k3s for this specific lab without forking the
# role.

# UFW on the k3s nodes can interfere with Flannel VXLAN (UDP 8472) and
# the kubelet (TCP 10250). GCP firewall rules already enforce the
# perimeter; leave UFW off on cluster nodes.
common_manage_ufw: false

# Bump together with the controller's kubectl. Keep all three nodes on
# the same version. Pin a SemVer tag from
# https://github.com/k3s-io/k3s/releases.
k3s_release_version: "v1.30.4+k3s1"
