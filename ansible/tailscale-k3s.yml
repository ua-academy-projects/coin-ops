---
# Installs Tailscale on k3s-server-1.
# After running, k3s-server-1 gets a Tailscale IP (100.x.x.x).
# Headlamp Ingress will only be accessible via this IP — no public exposure.

- name: Install Tailscale on k3s cluster nodes
  hosts: k3s_bootstrap
  become: yes
  vars:
    tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
  roles:
    - tailscale