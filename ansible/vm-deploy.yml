# –> deploy all VM services.

---
- name: Load shared deployment config
  hosts: all
  gather_facts: false
  roles:
    - shared_config

- name: Fetch deploy secrets from Google Secret Manager
  hosts: history:proxy:ui
  roles:
    - role: gsm_secrets
      when:
        - cloud == 'gcp'
        - google_project | length > 0

- name: Fetch deploy secrets from Azure Key Vault
  hosts: history:proxy:ui
  roles:
    - role: azure_secrets
      when:
        - cloud == 'azure'
        - azure_key_vault_name | length > 0

- name: Authenticate Docker registry on target nodes
  hosts: history:proxy:ui
  become: yes
  roles:
    - registry_auth

- name: Deploy History Service (node-01)
  hosts: history
  become: yes
  roles:
    - history

- name: Deploy Proxy Service (node-02)
  hosts: proxy
  become: yes
  roles:
    - proxy

- name: Deploy Web UI (node-03)
  hosts: ui
  become: yes
  roles:
    - ui
