---
# Main playbook for k3s cluster setup on GCP.
# Runs roles in order: prereqs → k3s_server (bootstrap+join in one role) → postcheck.
- name: Prepare all k3s nodes
  hosts: k3s_server
  become: yes
  roles:
    - common
    - k3s_prereqs

- name: Initialize and join k3s cluster
  hosts: k3s_server
  become: yes
  serial: 1
  roles:
    - k3s_server

- name: Validate cluster and fetch kubeconfig
  hosts: k3s_bootstrap
  become: yes
  roles:
    - k3s_postcheck
