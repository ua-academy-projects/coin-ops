
- name: Deploy CoinOps on AKS
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: cnpg_operator
      tags:
        - cnpg
        - data

    - role: coinops_data
      tags:
        - data

    - role: jenkins_deployer_rbac
      tags:
        - jenkins
        - cicd
        - rbac

    - role: coinops_app_chart
      tags:
        - app
        - chart
        - backend
        - frontend
        - ingress
        - proxy
        - history
        - ui

    - role: coinops_network_policy
      tags:
        - network-policy
        - netpol
        - security
