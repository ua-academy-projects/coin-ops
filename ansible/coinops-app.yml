---
# Deploy CoinOps application into the existing k3s cluster.
#
# This playbook is intentionally separate from:
#   - k3s-cluster.yml   (creates/joins the k3s cluster)
#   - k3s-platform.yml  (platform components: cert-manager, homepage, etc.)
#
# Run examples:
#   ansible-playbook -i ansible/inventory.k3s.gcp ansible/coinops-app.yml
#   ansible-playbook -i ansible/inventory.k3s.gcp ansible/coinops-app.yml --tags data
#   ansible-playbook -i ansible/inventory.k3s.gcp ansible/coinops-app.yml --tags backend
#   ansible-playbook -i ansible/inventory.k3s.gcp ansible/coinops-app.yml --tags frontend
#   ansible-playbook -i ansible/inventory.k3s.gcp ansible/coinops-app.yml --tags ingress

- name: Deploy CoinOps on k3s
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: cnpg_operator
      tags:
        - cnpg
        - data

    - role: coinops_data
      tags:
        - data

    - role: coinops_proxy
      tags:
        - proxy
        - backend

    - role: coinops_history
      tags:
        - history
        - backend

    - role: coinops_ui
      tags:
        - ui
        - frontend

    - role: coinops_ingress
      tags:
        - ingress
