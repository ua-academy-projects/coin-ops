---
# cloud-deploy.yml — provision + deploy the cloud-mode stack.
# Idempotent. Safe to re-run on every code push.
#
#   source .env
#   ansible-playbook -i <generated-cloud-inventory> ansible/cloud-deploy.yml

- name: Validate required environment variables
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check .env vars are exported
      ansible.builtin.assert:
        that:
          - lookup('env', 'SSH_KEY_PATH') != ''
          - lookup('env', 'RUNTIME_BACKEND') in ['', 'external', 'postgres', 'cloud_native']
        fail_msg: |
          Required environment variables are not set or RUNTIME_BACKEND is invalid.
          Run: source .env

- name: Resolve runtime secrets from cloud secret manager
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [cloud-secrets]

- hosts: bastion
  become: true
  roles: [cloud-bastion-stack]

- hosts: db
  become: true
  roles: [cloud-db-stack]

- hosts: app
  become: true
  roles: [cloud-app-stack]

- hosts: ui
  become: true
  roles: [cloud-ui-stack]
