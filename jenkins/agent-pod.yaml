# Jenkins Kubernetes agent pod — referenced by the Jenkinsfile (yamlFile).
# Deploy-only: a single `helm` container. Runs as the `jenkins` ServiceAccount,
# which Terraform grants in-cluster RBAC to deploy coinops-app. No build tools
# (images are built by Cloud Build), no cloud creds (same-cluster deploy).
apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins
  containers:
    - name: helm
      image: alpine/helm:3.16.3
      command: ["cat"]
      tty: true
