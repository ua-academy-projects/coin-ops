apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-api
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: history-api
    app.kubernetes.io/part-of: coin-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: history-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: history-api
        app.kubernetes.io/part-of: coin-ops
    spec:
      containers:
        - name: history-api
          image: ghcr.io/ua-academy-projects/coin-ops-history-api:shabat-latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: coin-ops-config
                  key: HISTORY_API_PORT
          envFrom:
            - secretRef:
                name: coin-ops-secret
            - configMapRef:
                name: coin-ops-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: history-api
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: history-api
    app.kubernetes.io/part-of: coin-ops
spec:
  selector:
    app.kubernetes.io/name: history-api
  ports:
    - name: http
      port: 8000
      targetPort: http
