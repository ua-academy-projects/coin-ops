apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: coin-ops
    app.kubernetes.io/part-of: coin-ops
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-history-prefix
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: coin-ops
    app.kubernetes.io/part-of: coin-ops
spec:
  stripPrefix:
    prefixes:
      - /history-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coin-ops
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: coin-ops
    app.kubernetes.io/part-of: coin-ops
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: coin-ops-strip-api-prefix@kubernetescrd,coin-ops-strip-history-prefix@kubernetescrd
spec:
  rules:
    - host: coinops.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 8080
          - path: /history-api
            pathType: Prefix
            backend:
              service:
                name: history-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
