apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: coin-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/part-of: coin-ops
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ui
          image: ghcr.io/ua-academy-projects/coin-ops-ui:shabat-latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: coin-ops-config
                  key: PROXY_URL
            - name: HISTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: coin-ops-config
                  key: HISTORY_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: coin-ops
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: http
