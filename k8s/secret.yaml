apiVersion: v1
kind: Secret
metadata:
  name: coin-ops-secret
  namespace: coin-ops
  labels:
    app.kubernetes.io/part-of: coin-ops
type: Opaque
stringData:
  POSTGRES_USER: cognitor
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: cognitor
  DATABASE_URL: postgresql://app:changeme@postgres:5432/app
  RABBITMQ_DEFAULT_USER: cognitor
  RABBITMQ_DEFAULT_PASS: changeme
  RABBITMQ_URL: amqp://cognitor:changeme@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
