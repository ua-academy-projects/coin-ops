apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: coin-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy
        app.kubernetes.io/part-of: coin-ops
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: proxy
          image: ghcr.io/ua-academy-projects/coin-ops-proxy:shabat-latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: coin-ops-config
                  key: PROXY_PORT
          envFrom:
            - secretRef:
                name: coin-ops-secret
            - configMapRef:
                name: coin-ops-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: coin-ops
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: coin-ops
spec:
  selector:
    app.kubernetes.io/name: proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
