trigger: none
pr: none

parameters:
  - name: apply
    displayName: Run terraform apply
    type: boolean
    default: false

variables:
  terraformVersion: "1.9.8"
  terraformWorkingDirectory: "terraform/cloud"
  backendResourceGroup: "$(TF_BACKEND_RESOURCE_GROUP)"
  backendStorageAccount: "$(TF_BACKEND_STORAGE_ACCOUNT)"
  backendContainer: "$(TF_BACKEND_CONTAINER)"
  backendKey: "cloud/terraform.tfstate"

stages:
  - stage: plan
    displayName: Terraform Plan
    jobs:
      - job: plan
        displayName: Plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -o terraform.zip
              sudo mv terraform /usr/local/bin/terraform
              terraform version
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Terraform init and plan
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                terraform -chdir="$(terraformWorkingDirectory)" init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)"

                terraform -chdir="$(terraformWorkingDirectory)" plan \
                  -out=tfplan

          - publish: "$(terraformWorkingDirectory)/tfplan"
            artifact: tfplan
            displayName: Publish Terraform plan

  - stage: apply
    displayName: Terraform Apply
    dependsOn: plan
    condition: and(succeeded(), eq(${{ parameters.apply }}, true))
    jobs:
      - deployment: apply
        displayName: Apply
        environment: terraform-apply
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                    unzip -o terraform.zip
                    sudo mv terraform /usr/local/bin/terraform
                    terraform version
                  displayName: Install Terraform

                - download: current
                  artifact: tfplan
                  displayName: Download Terraform plan

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      terraform -chdir="$(terraformWorkingDirectory)" init \
                        -backend-config="resource_group_name=$(backendResourceGroup)" \
                        -backend-config="storage_account_name=$(backendStorageAccount)" \
                        -backend-config="container_name=$(backendContainer)" \
                        -backend-config="key=$(backendKey)"

                      cp "$(Pipeline.Workspace)/tfplan/tfplan" "$(terraformWorkingDirectory)/tfplan"
                      terraform -chdir="$(terraformWorkingDirectory)" apply \
                        -auto-approve \
                        tfplan
