# Traces pillar (no app recompile): Grafana Beyla (eBPF) auto-instruments the
# coinops-* services and ships OTLP traces to an OpenTelemetry Collector, which
# forwards them to Application Insights via the Azure Monitor exporter.
#
# Apply after creating the `appinsights` secret (connstr) in the observability ns:
#   APPINS_CONN=$(az monitor app-insights component show -g coinops-lab-rg \
#       -a coinops-lab-appins --query connectionString -o tsv)
#   kubectl create ns observability --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n observability create secret generic appinsights \
#       --from-literal=connstr="$APPINS_CONN" --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f observability/k8s/beyla-traces.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# --- OpenTelemetry Collector (Azure Monitor exporter) ------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
    exporters:
      azuremonitor:
        connection_string: "${APPLICATIONINSIGHTS_CONNECTION_STRING}"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [azuremonitor]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: appinsights, key: connstr }
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/otel }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi } # capped — single-core nodes
      volumes:
        - name: cfg
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app: otel-collector }
  ports:
    - { name: grpc, port: 4317, targetPort: 4317 }
    - { name: http, port: 4318, targetPort: 4318 }
---
# --- Beyla (eBPF auto-instrumentation) ---------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata: { name: beyla, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: beyla }
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: beyla }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: beyla }
subjects:
  - { kind: ServiceAccount, name: beyla, namespace: observability }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: beyla-config, namespace: observability }
data:
  beyla-config.yml: |
    discovery:
      services:
        - k8s_namespace: "coinops-.*"
    attributes:
      kubernetes:
        enable: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: beyla, namespace: observability }
spec:
  selector:
    matchLabels: { app: beyla }
  template:
    metadata:
      labels: { app: beyla }
    spec:
      serviceAccountName: beyla
      hostPID: true
      # Pinned to ONE node: the 1-vCPU k3s nodes can't run eBPF on every node
      # without starving the k3s control plane (k3s-1/3 hit 100% CPU and the
      # apiserver refused connections). A DaemonSet + hostname nodeSelector runs
      # exactly one Beyla, on the node that has spare CPU. Traces cover the
      # workloads scheduled on this node (eBPF + hostPID see same-node processes).
      nodeSelector:
        kubernetes.io/hostname: coinops-lab-k3s-2
      containers:
        - name: beyla
          image: grafana/beyla:1.9.6
          securityContext:
            privileged: true
          env:
            - name: BEYLA_CONFIG_PATH
              value: /config/beyla-config.yml
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
          volumeMounts:
            - { name: cfg, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            # Hard CPU cap so Beyla can't peg the single core and starve k3s.
            # Memory stays at 512Mi — eBPF maps need it (256Mi OOM'd).
            limits: { cpu: 150m, memory: 512Mi }
      volumes:
        - name: cfg
          configMap: { name: beyla-config }
